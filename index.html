<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الجمعيات الأهلية</title>
<meta name="theme-color" content="#1f6f6b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الجمعيات">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --page:#f5f4f0; --surface:#ffffff; --surface-2:#f9f8f5; --line:#e4e2dc; --line-2:#d3d0c7;
  --ink:#1b1b19; --ink-2:#55534e; --muted:#8a877f;
  --aza:#1f6f6b; --aza-soft:#e3f0ee; --majlis:#8a5a1c; --majlis-soft:#f5ecdd;
  --accent:var(--aza); --accent-soft:var(--aza-soft);
  --s1:#2a78d6; --s2:#eb6834;
  --good:#0c7a0c; --good-soft:#e6f4e6; --bad:#c23535; --bad-soft:#fbe9e9; --warn:#a86b00; --warn-soft:#fdf3dc;
  --r:10px; --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 10px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:Tajawal,"Segoe UI",Tahoma,Arial,sans-serif;font-size:15px;line-height:1.55}
body.aza{--accent:var(--aza);--accent-soft:var(--aza-soft)}
body.majlis{--accent:var(--majlis);--accent-soft:var(--majlis-soft)}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,th.n{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:plaintext}
a{color:var(--accent)}

/* header */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-in{max-width:1400px;margin:auto;display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;cursor:pointer;background:none;border:0;padding:0}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:17px}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.switch{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;margin-inline-start:auto}
.switch button{border:0;background:none;padding:6px 14px;border-radius:7px;cursor:pointer;font-weight:700;color:var(--ink-2)}
.switch button.on{background:var(--accent);color:#fff}
.tabs{max-width:1400px;margin:auto;display:flex;gap:2px;padding:0 12px;overflow-x:auto;scrollbar-width:thin}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--ink-2);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}

main{max-width:1400px;margin:auto;padding:18px 16px 60px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;margin:0}
.sub{color:var(--muted);font-size:13px;margin:0}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar .grow{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-b{padding:14px 16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.kpi .l{color:var(--ink-2);font-size:13px}
.kpi .v{font-size:24px;font-weight:800;margin-top:2px}
.kpi .v small{font-size:13px;font-weight:500;color:var(--muted);margin-inline-start:4px}
.kpi .h{font-size:12px;color:var(--muted)}
.kpi.good .v{color:var(--good)} .kpi.bad .v{color:var(--bad)} .kpi.acc{border-top:3px solid var(--accent)}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 9px;font-size:13px;border-radius:6px}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}
.inp,select.inp{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
.inp:focus,.cell:focus{outline:2px solid var(--accent);outline-offset:-1px}
.search{min-width:220px}

/* tables */
.tw{overflow:auto;max-width:100%}
table{border-collapse:collapse;width:100%;background:var(--surface)}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
th{background:var(--surface-2);font-size:13px;color:var(--ink-2);font-weight:700;position:sticky;top:0;z-index:1;white-space:nowrap}
td.n,th.n{text-align:center}
tr.grp td{background:var(--accent-soft);font-weight:800;color:var(--accent)}
tr.tot td{background:var(--surface-2);font-weight:800}
tr.grand td{background:var(--accent);color:#fff;font-weight:800}
tr.off td{color:var(--muted)}
tbody tr:hover td{background:#fafaf7}
tr.grp:hover td{background:var(--accent-soft)}
tr.grand:hover td{background:var(--accent)}
.nm{white-space:nowrap;font-weight:600}
.cell{width:46px;border:1px solid transparent;background:transparent;text-align:center;padding:4px 2px;border-radius:5px;direction:ltr}
.cell:hover{border-color:var(--line-2)}
.cell.z{color:#c9c6bd}
.cell.p{background:var(--good-soft);color:var(--good);font-weight:700}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.t-good{color:var(--good);font-weight:700} .t-bad{color:var(--bad);font-weight:700} .t-mut{color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* progress */
.prog{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* chart */
.chart{position:relative;padding:8px 0 0}
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink-2);margin-bottom:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px;background:var(--c)}
.plot{display:flex;align-items:flex-end;gap:10px;height:210px;border-bottom:1px solid var(--line-2);padding:0 4px;direction:ltr}
.col{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100%;position:relative;cursor:default;min-width:22px}
.col b{display:block;width:40%;max-width:18px;border-radius:4px 4px 0 0;min-height:1px}
.col:hover{background:rgba(0,0,0,.035);border-radius:6px 6px 0 0}
.xl{display:flex;gap:10px;padding:4px 4px 0;direction:ltr}
.xl span{flex:1;text-align:center;font-size:11px;color:var(--muted);min-width:22px}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;padding:7px 10px;border-radius:8px;font-size:12.5px;z-index:100;display:none;line-height:1.6;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.tip i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-inline-end:5px}

/* home */
.home{max-width:980px;margin:30px auto}
.home h1{font-size:28px;text-align:center}
.home .sub{text-align:center;margin-bottom:26px;font-size:15px}
.cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s;text-align:right;width:100%}
.acard:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.acard .ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:24px;color:#fff;margin-bottom:12px}
.acard h2{font-size:21px}
.acard p{color:var(--ink-2);margin:4px 0 14px;font-size:14px}
.acard dl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0}
.acard dt{font-size:12px;color:var(--muted)} .acard dd{margin:0;font-weight:800;font-size:18px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(20,20,18,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:40px 12px;overflow:auto}
.modal{background:var(--surface);border-radius:14px;width:min(560px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.wide{width:min(900px,100%)}
.modal-h{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-h h2{flex:1}
.modal-b{padding:16px 18px}
.modal-f{display:flex;gap:8px;justify-content:flex-start;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 14px 14px}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:13px;color:var(--ink-2);font-weight:600;margin-bottom:4px}
.fld .inp{width:100%}
.fld.chk{display:flex;align-items:center;gap:8px}
.fld.chk>span{margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:10px;z-index:200;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.note{background:var(--warn-soft);border:1px solid #efd9a6;color:#6d4a00;border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.muted-box{background:var(--surface-2);border:1px dashed var(--line-2);border-radius:10px;padding:10px 14px;font-size:13.5px;color:var(--ink-2)}
.print-title{display:none}
.credit{text-align:center;color:var(--muted);font-size:13px;padding:18px 16px 28px;border-top:1px solid var(--line);max-width:1400px;margin:0 auto}
.credit b{color:var(--ink-2);font-weight:700}
main+.credit{margin-top:-40px}
/* first column stays visible while scrolling wide tables sideways */
table.sticky1 tbody tr:not(.grp) td:first-child, table.sticky1 thead th:first-child, table.sticky1 tfoot td:first-child{position:sticky;right:0;z-index:2;background:var(--surface);box-shadow:-1px 0 0 var(--line)}
table.sticky1 thead th:first-child{z-index:3;background:var(--surface-2)}
table.sticky1 tfoot tr.grand td:first-child{background:var(--accent)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mcell{display:block}
.mcell span{display:block;font-size:13px;color:var(--ink-2);margin-bottom:3px}
.mcell .inp{width:100%;text-align:center;direction:ltr}
.mcell.paid .inp{background:var(--good-soft);border-color:#b9dcb9;color:var(--good);font-weight:700}
.syncbig{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.syncbig .btn{font-size:17px;padding:12px 20px;width:100%;justify-content:center}
.steps{margin:0;padding-inline-start:20px;color:var(--ink-2);font-size:14px}
.steps li{margin-bottom:6px}
.topsync{margin-inline-start:6px}
@media (max-width:640px){
  body{font-size:14px}
  .row2{grid-template-columns:1fr 1fr}
  .search{min-width:0;width:100%}
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .kpi{padding:10px 11px}
  .kpi .v{font-size:19px}
  .g2{grid-template-columns:1fr}
  .top-in{padding:8px 12px;gap:8px}
  .brand{font-size:16px}
  .brand small{display:none}
  .switch{order:3;width:100%;margin-inline-start:0}
  .switch button{flex:1}
  .topsync{margin-inline-start:auto}
  main{padding:12px 12px 90px}
  h1{font-size:19px}
  .bar{gap:8px}
  .bar>select.inp{flex:1 1 40%}
  th,td{padding:6px 8px}
  .cell{width:40px;padding:6px 2px}
  .ov{padding:0;align-items:stretch}
  .modal,.modal.wide{width:100%;border-radius:0;min-height:100%;display:flex;flex-direction:column}
  .modal-b{flex:1}
  .modal-f{border-radius:0;position:sticky;bottom:0}
  .home{margin:14px auto}
  .home h1{font-size:23px}
  .acard{padding:16px}
}
@media (max-width:380px){ .row2{grid-template-columns:1fr} .mgrid{grid-template-columns:repeat(2,1fr)} }
@media print{
  body{background:#fff;font-size:12px}
  .top,.bar .btn,.noprint,.btn{display:none!important}
  main{padding:0;max-width:none}
  .card{box-shadow:none;border:0}
  .tw{overflow:visible}
  th{position:static}
  .print-title{display:block;text-align:center;margin-bottom:10px}
  .cell{border:0}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="tip" id="tip"></div>

<script>
"use strict";
/* ============================================================ data */
const SEED = /*__SEED__*/null;
const LS_KEY = "ahliya-jamiyat-v1";
const MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const DEV_KEY = "ahliya-device";
const SNAP_KEY = "ahliya-before-sync";

function emptyDB(){
  return { version: 2, deleted: {}, meta: {},
    aza: { settings: { title: "جمعية العزاء", monthlyFee: 2, bankBalance: 0, currency: "ر.ع" }, settingsTs: 0,
           groups: [], members: [], years: {}, expenses: [], income: [], receipts: [] },
    majlis: { settings: { title: "جمعية المجلس", currency: "ر.ع", contractTotal: 0 }, settingsTs: 0,
              groups: [], members: [], plans: [], overrides: {}, overridesTs: {}, payments: [], expenses: [], income: [],
              stages: [], contractorPayments: [], receipts: [] } };
}
/* brings data from any earlier version up to the current shape (v2 adds change-tracking for sync) */
function migrate(d){
  if (!d || typeof d !== "object" || !d.aza || !d.majlis) return null;
  const e = emptyDB();
  for (const a of ["aza", "majlis"]) for (const [k, v] of Object.entries(e[a])) if (d[a][k] === undefined) d[a][k] = (d.version === 1 && k === "settingsTs") ? 1 : v;
  for (const y of Object.values(d.aza.years)) y.ts = y.ts || {};
  d.deleted = d.deleted || {}; d.meta = d.meta || {};
  // the old "قائمة التعزيز" plan became "الجمعية الثالثة": 100 per member, paid in instalments of 20
  const p4 = d.majlis.plans.find(p => p.id === "p4");
  if (p4 && /^قائمة التعزيز/.test(p4.name)) Object.assign(p4, { name: "الجمعية الثالثة", amount: 100, installment: 20, note: "100 ريال على 5 دفعات، كل دفعة 20 ريال", u: Date.now() });
  // one-time: مجموعة خليفة بن راشد removed from the system; its money stays as other income (fixed id so devices agree)
  d.fixes = d.fixes || {};
  if (!d.fixes.khalifa) {
    const g = d.majlis.groups.find(g => /خليفة بن راشد/.test(g.name));
    if (g) removeGroup(d, "majlis", g.id, `مساهمات أخرى — ${g.name}`, "mi-khalifa");
    d.fixes.khalifa = true;
  }
  d.version = 2;
  return d;
}
/* deletes a group, its members and their payments (as tombstones, so sync carries it);
   the money they paid is kept as one "other income" entry so the balance does not change */
function removeGroup(d, a, gid, incomeTitle, incomeId){
  const ts = Date.now(), L = d[a];
  const mids = L.members.filter(m => m.groupId === gid).map(m => m.id), set = new Set(mids);
  let total = 0;
  if (a === "majlis") {
    const ps = L.payments.filter(p => set.has(p.memberId));
    total = sum(ps, p => p.amount);
    ps.forEach(p => d.deleted[`majlis:payments:${p.id}`] = ts);
    L.payments = L.payments.filter(p => !set.has(p.memberId));
    mids.forEach(id => { if (L.overrides[id]) { delete L.overrides[id]; L.overridesTs[id] = ts; } });
  } else {
    for (const [y, yr] of Object.entries(L.years)) for (const id of mids) if (yr.pay[id]) {
      total += sum(yr.pay[id]); delete yr.pay[id]; delete yr.ts[id]; d.deleted[`aza:row:${y}:${id}`] = ts;
    }
  }
  mids.forEach(id => d.deleted[`${a}:members:${id}`] = ts);
  L.members = L.members.filter(m => m.groupId !== gid);
  L.groups = L.groups.filter(g => g.id !== gid); d.deleted[`${a}:groups:${gid}`] = ts;
  if (total && incomeTitle) L.income.push({ id: incomeId || uid("l"), title: incomeTitle, amount: total, date: today(), u: ts });
  return { members: mids.length, total };
}

let DB = null;
try { DB = migrate(JSON.parse(localStorage.getItem(LS_KEY))); } catch (e) {}
if (!DB) DB = migrate(SEED ? clone(SEED) : emptyDB());

/* per-device settings — never synced */
let DEV = {};
try { DEV = JSON.parse(localStorage.getItem(DEV_KEY)) || {}; } catch (e) {}
const IS_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
if (!DEV.name) DEV.name = IS_MOBILE ? "الجوال" : "الكمبيوتر";
if (!DEV.prefix) DEV.prefix = IS_MOBILE ? "ج" : "ك";
function saveDev(){ try { localStorage.setItem(DEV_KEY, JSON.stringify(DEV)); } catch (e) {} }

const now = () => Date.now();
function touch(o){ if (o) o.u = now(); return o; }
function tomb(key){ DB.deleted[key] = now(); }

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function save(){
  DB.meta.savedAt = new Date().toISOString();
  try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); }
  catch (e) { toast("تعذّر الحفظ في المتصفح — صدّر نسخة احتياطية الآن"); }
}
function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function n(v){ const x = parseFloat(v); return isFinite(x) ? x : 0; }
function fmt(v){ return (Math.round(n(v)*1000)/1000).toLocaleString("en-US",{maximumFractionDigits:3}); }
function money(v){ return `<span class="num">${fmt(v)}</span>`; }
function today(){ return new Date().toISOString().slice(0,10); }
function yearOf(d){ const m = String(d||"").match(/(\d{4})/); return m ? +m[1] : null; }
function norm(s){ return String(s||"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ـ/g,"").toLowerCase(); }
function sum(arr, f = x => x){ return arr.reduce((s,x) => s + n(f(x)), 0); }

/* ============================================================ state */
const S = { a: null, tab: "dash", year: null, group: "", q: "", showOff: false, expYear: "" };
const TABS = {
  aza: [["dash","لوحة المعلومات"],["subs","الاشتراكات الشهرية"],["arrears","المتأخرات"],["expenses","المصروفات"],["income","إيرادات أخرى"],["members","الأعضاء والمجموعات"],["reports","التقارير السنوية"],["receipts","الإيصالات"],["settings","الإعدادات"],["sync","المزامنة"]],
  majlis: [["dash","لوحة المعلومات"],["contrib","المساهمات"],["pay","تسجيل دفعة"],["late","المتخلفون عن الدفع"],["expenses","مصروفات البناء"],["income","إيرادات أخرى"],["contractor","المقاول"],["members","الأعضاء والمجموعات"],["plans","بنود المساهمة"],["receipts","الإيصالات"],["settings","الإعدادات"],["sync","المزامنة"]],
};

/* ============================================================ common helpers */
function groupsOf(a){ return DB[a].groups; }
function membersOf(a){ return DB[a].members; }
function member(a, id){ return DB[a].members.find(m => m.id === id); }
function groupName(a, id){ const g = DB[a].groups.find(g => g.id === id); return g ? g.name : "بدون مجموعة"; }
function shortGroup(name){ return String(name).replace(/^مجموعة\s*/,""); }
function sortedMembers(a, filterFn = () => true){
  const order = new Map(DB[a].groups.map((g,i) => [g.id,i]));
  return DB[a].members.filter(filterFn).slice().sort((x,y) => (order.get(x.groupId) ?? 999) - (order.get(y.groupId) ?? 999));
}
function groupOptions(a, sel, withAll){
  return (withAll ? `<option value="">كل المجموعات</option>` : "") +
    DB[a].groups.map(g => `<option value="${g.id}" ${g.id===sel?"selected":""}>${esc(shortGroup(g.name))}</option>`).join("");
}
function searchBox(){ return `<input class="inp search" type="search" placeholder="بحث بالاسم…" data-search value="${esc(S.q)}">`; }

/* ============================================================ جمعية العزاء — calculations */
const AZ = {
  get d(){ return DB.aza; },
  fee(){ return n(DB.aza.settings.monthlyFee) || 0; },
  years(){ return Object.keys(DB.aza.years).map(Number).sort((a,b) => a-b); },
  cutoff(){
    const s = DB.aza.settings;
    if (s.cutoff) { const [y,m] = s.cutoff.split("-").map(Number); if (y && m) return {y,m}; }
    const d = new Date(); return { y: d.getFullYear(), m: d.getMonth()+1 };
  },
  row(y, mid){ return DB.aza.years[y]?.pay[mid]; },
  paid(y, mid){ const r = AZ.row(y, mid); return r ? sum(r) : 0; },
  dueMonths(y){ const c = AZ.cutoff(); return y < c.y ? 12 : y === c.y ? c.m : 0; },
  due(y, mid){ const m = member("aza", mid); if (!m || m.exempt) return 0; return AZ.dueMonths(y) * AZ.fee(); },
  arrears(y, mid){ return Math.max(0, AZ.due(y, mid) - AZ.paid(y, mid)); },
  memberSummary(mid){
    const rows = AZ.years().filter(y => AZ.row(y, mid)).map(y => ({ y, paid: AZ.paid(y, mid), due: AZ.due(y, mid), arrears: AZ.arrears(y, mid) }));
    return { rows, paid: sum(rows, r => r.paid), due: sum(rows, r => r.due), arrears: sum(rows, r => r.arrears) };
  },
  yearSummary(y){
    const ids = Object.keys(DB.aza.years[y]?.pay || {});
    const exp = sum(DB.aza.expenses.filter(e => yearOf(e.date) === y), e => e.amount);
    const inc = sum(DB.aza.income.filter(e => yearOf(e.date) === y), e => e.amount);
    return { y, count: ids.filter(id => !member("aza", id)?.exempt).length, paid: sum(ids, id => AZ.paid(y, id)),
             due: sum(ids, id => AZ.due(y, id)), arrears: sum(ids, id => AZ.arrears(y, id)), exp, inc };
  },
  totals(){
    const ys = AZ.years().map(AZ.yearSummary);
    const paid = sum(ys, r => r.paid), exp = sum(DB.aza.expenses, e => e.amount), inc = sum(DB.aza.income, e => e.amount);
    return { ys, paid, exp, inc, arrears: sum(ys, r => r.arrears), balance: paid + inc - exp };
  },
};

/* ============================================================ جمعية المجلس — calculations */
const MJ = {
  required(mid, pid){
    const o = DB.majlis.overrides[mid];
    if (o && o[pid] !== undefined && o[pid] !== null && o[pid] !== "") return n(o[pid]);
    const m = member("majlis", mid); if (m && m.exempt) return 0;
    const p = DB.majlis.plans.find(p => p.id === pid); return p ? n(p.amount) : 0;
  },
  paid(mid, pid){ return sum(DB.majlis.payments.filter(p => p.memberId === mid && (!pid || p.planId === pid)), p => p.amount); },
  member(mid){
    const plans = DB.majlis.plans.map(p => { const req = MJ.required(mid, p.id), paid = MJ.paid(mid, p.id); return { p, req, paid, rem: Math.max(0, req - paid) }; });
    return { plans, req: sum(plans, x => x.req), paid: sum(plans, x => x.paid), rem: sum(plans, x => x.rem) };
  },
  totals(){
    const ms = DB.majlis.members.filter(m => m.active !== false);
    const per = ms.map(m => ({ m, ...MJ.member(m.id) }));
    const paidAll = sum(DB.majlis.payments, p => p.amount);
    const exp = sum(DB.majlis.expenses, e => e.amount), inc = sum(DB.majlis.income, e => e.amount);
    return { per, count: ms.length, req: sum(per, x => x.req), paid: paidAll, rem: sum(per, x => x.rem), exp, inc, balance: paidAll + inc - exp };
  },
};

function backupNag(){

function pageHead(title, sub, actions = ""){

function kpi(label, value, hint = "", cls = ""){ return `<div class="kpi ${cls}"><div class="l">${label}</div><div class="v">${value}</div>${hint ? `<div class="h">${hint}</div>` : ""}</div>`; }
function progress(p){ return `<div class="prog"><i style="width:${Math.max(0,Math.min(100,p)).toFixed(1)}%"></i></div>`; }
const cur = () => `<small>${esc(DB[S.a].settings.currency || "ر.ع")}</small>`;

/* bar chart: series = [{name,color,values}] labels=[...] */
function barChart(labels, series){
  const max = Math.max(1, ...series.flatMap(s => s.values));
  const cols = labels.map((l,i) => {
    const tip = `<b>${esc(l)}</b><br>` + series.map(s => `<i style="background:${s.color}"></i>${esc(s.name)}: ${fmt(s.values[i])}`).join("<br>");
    return `<div class="col" data-tip="${esc(tip)}">${series.map(s => `<b style="height:${(s.values[i]/max*100).toFixed(2)}%;background:${s.color}"></b>`).join("")}</div>`;
  }).join("");
  return `<div class="chart"><div class="legend">${series.map(s => `<span style="--c:${s.color}">${esc(s.name)}</span>`).join("")}</div>
    <div class="plot">${cols}</div><div class="xl">${labels.map(l => `<span>${esc(l)}</span>`).join("")}</div></div>`;
}

function groupYearTable(){
  const ys = AZ.years().slice(-8);

/* ============================================================ modal forms */
function modal(title, bodyHTML, { wide = false, onSave = null, saveLabel = "حفظ", altLabel = "" } = {}){
  closeModal();
  const ov = document.createElement("div");
  ov.className = "ov"; ov.id = "ov";
  ov.innerHTML = `<form class="modal ${wide ? "wide" : ""}" novalidate><div class="modal-h"><h2>${esc(title)}</h2><button type="button" class="btn sm ghost" data-close>✕</button></div>
    <div class="modal-b">${bodyHTML}</div>
    <div class="modal-f">${onSave && altLabel ? `<button class="btn pri" type="submit" value="alt">${altLabel}</button>` : ""}${onSave ? `<button class="btn ${altLabel ? "" : "pri"}" type="submit" value="save">${saveLabel}</button>` : ""}<button type="button" class="btn" data-close>${onSave ? "إلغاء" : "إغلاق"}</button></div></form>`;
  document.body.appendChild(ov);
  const f = ov.querySelector("form");
  ov.addEventListener("click", e => { if (e.target === ov || e.target.closest("[data-close]")) closeModal(); });
  f.addEventListener("submit", e => {
    e.preventDefault();
    if (!onSave) return closeModal();
    if (!f.checkValidity()) { f.reportValidity(); return; }
    const vals = {};
    new FormData(f).forEach((v,k) => vals[k] = v);
    f.querySelectorAll("input[type=checkbox][name]").forEach(c => vals[c.name] = c.checked);
    vals.__alt = e.submitter?.value === "alt";
    const after = onSave(vals, f);
    if (after !== false) { closeModal(); save(); render(); if (typeof after === "function") after(); }
  });
  const first = f.querySelector("input:not([type=hidden]),select,textarea");
  if (first) first.focus();
  return f;
}
function closeModal(){ document.getElementById("ov")?.remove(); }
function fld(label, name, value = "", type = "text", extra = ""){
  return `<label class="fld"><span>${label}</span><input class="inp" name="${name}" type="${type}" value="${esc(value)}" ${type === "number" ? `step="0.001"` : ""} ${extra}></label>`;
}

async function drawReceipt(a, o){
  try { await document.fonts?.load?.("700 30px Tajawal"); await document.fonts?.ready; } catch (e) {}
  const W = 900, FF = 'Tajawal, "Segoe UI", Tahoma, Arial, sans-serif', font = (w, s) => `${w} ${s}px ${FF}`;

  for (const [l, ls] of rows) {

function groupReportData(a, gid, flt){
  const ms = DB[a].members.filter(m => m.groupId === gid && m.active !== false && !m.exempt);
  let lines;
  if (a === "aza") {
    const ys = flt ? [+flt] : AZ.years();
    lines = ms.map(m => {
      const rows = ys.filter(y => AZ.row(y, m.id)).map(y => ({ y, paid: AZ.paid(y, m.id), due: AZ.due(y, m.id), arr: AZ.arrears(y, m.id) }));
      return { id: m.id, name: m.name, req: sum(rows, r => r.due), paid: sum(rows, r => r.paid), rem: sum(rows, r => r.arr),
        detail: rows.filter(r => r.arr > 0).map(r => flt ? `${fmt(r.arr / AZ.fee())} أشهر غير مسددة` : `${r.y}: ${fmt(r.arr)}`).join("، "), on: rows.length > 0 };
    }).filter(l => l.on);
  } else {
    lines = ms.map(m => {
      const ps = MJ.member(m.id).plans.filter(x => !flt || x.p.id === flt);
      return { id: m.id, name: m.name, req: sum(ps, x => x.req), paid: sum(ps, x => x.paid), rem: sum(ps, x => x.rem),
        detail: ps.filter(x => x.rem > 0).map(x => flt ? `باقي ${fmt(x.rem)} من ${fmt(x.req)}` : `${x.p.name}: ${fmt(x.rem)}`).join("، ") };
    });
  }
  lines.sort((x, y) => (y.rem > 0) - (x.rem > 0) || y.rem - x.rem);
  const req = sum(lines, l => l.req), paid = sum(lines, l => l.paid), rem = sum(lines, l => l.rem);
  return { lines, req, paid, rem, late: lines.filter(l => l.rem > 0).length, pct: req ? Math.min(100, (req - rem) / req * 100) : 100 };
}

async function drawReport(a, gname, scope, d){

  stats.forEach(([l, v, col], i) => {
    const x = W - 50 - (i + 1) * bw - i * 20;

    g.textAlign = "center"; g.fillStyle = "#55534e"; g.font = font(500, 26); g.fillText(l, x + bw / 2, 300);
    let size = 52; g.font = font(800, size); while (g.measureText(v).width > bw - 30 && size > 28) g.font = font(800, --size);

  let y = 560; g.textAlign = "right";
  for (const [l, v] of [["المجموعة", gname], ["الفترة / البند", scope], ["الأعضاء", `${d.lines.length} عضو — المتأخرون: ${d.late}`]]) {

    g.textAlign = "right"; g.fillStyle = "#1b1b19"; g.fillText(l.name, W - 75, y);

    y += h;

/* merges R into L in place: newest change per record wins; deletions travel as tombstones */
function mergeDB(L, R){
  const st = { add: 0, upd: 0, del: 0 };
  const tombs = { ...L.deleted };
  for (const [k, t] of Object.entries(R.deleted)) if (!(tombs[k] >= t)) tombs[k] = t;
  const dead = (key, u) => { const t = tombs[key]; return t !== undefined && t >= (u || 0); };
  for (const a of ["aza", "majlis"]) {
    const l = L[a], r = R[a];
    if ((r.settingsTs || 0) > (l.settingsTs || 0)) { l.settings = r.settings; l.settingsTs = r.settingsTs; st.upd++; }
    for (const name of SYNC_LISTS[a]) {
      const arr = l[name] = l[name] || [];
      const idx = new Map(arr.map((x, i) => [x.id, i]));
      for (const item of r[name] || []) {
        if (dead(`${a}:${name}:${item.id}`, item.u)) continue;
        if (!idx.has(item.id)) { idx.set(item.id, arr.length); arr.push(item); st.add++; }
        else if ((item.u || 0) > (arr[idx.get(item.id)].u || 0)) { arr[idx.get(item.id)] = item; st.upd++; }
      }
      const kept = arr.filter(x => !dead(`${a}:${name}:${x.id}`, x.u));
      st.del += arr.length - kept.length; l[name] = kept;
    }
    if ((r.groupsOrderTs || 0) > (l.groupsOrderTs || 0)) {
      const pos = new Map(r.groups.map((g, i) => [g.id, i]));
      l.groups.sort((x, y) => (pos.get(x.id) ?? 1e9) - (pos.get(y.id) ?? 1e9));
      l.groupsOrderTs = r.groupsOrderTs;
    }
  }
  for (const [y, ry] of Object.entries(R.aza.years)) {
    const ly = L.aza.years[y] = L.aza.years[y] || { pay: {}, ts: {} };
    for (const [mid, row] of Object.entries(ry.pay)) {
      const rt = ry.ts[mid] || 0;
      if (dead(`aza:row:${y}:${mid}`, rt)) continue;
      if (!ly.pay[mid]) { ly.pay[mid] = row; if (rt) ly.ts[mid] = rt; st.add++; }
      else if (rt > (ly.ts[mid] || 0)) { ly.pay[mid] = row; ly.ts[mid] = rt; st.upd++; }
    }
  }
  for (const [y, ly] of Object.entries(L.aza.years))
    for (const mid of Object.keys(ly.pay)) if (dead(`aza:row:${y}:${mid}`, ly.ts[mid])) { delete ly.pay[mid]; delete ly.ts[mid]; st.del++; }
  const lo = L.majlis, ro = R.majlis;
  for (const mid of new Set([...Object.keys(ro.overrides), ...Object.keys(ro.overridesTs)])) {
    const rt = ro.overridesTs[mid] || 0, lt = lo.overridesTs[mid] || 0;
    if (rt > lt || (rt === lt && !lo.overrides[mid] && ro.overrides[mid])) {
      if (JSON.stringify(lo.overrides[mid]) !== JSON.stringify(ro.overrides[mid])) st.upd++;
      if (ro.overrides[mid]) lo.overrides[mid] = ro.overrides[mid]; else delete lo.overrides[mid];
      if (rt) lo.overridesTs[mid] = rt;
    }
  }
  L.deleted = tombs;
  return st;
}
async function exportSync(){

  const data = JSON.stringify({ ...DB, meta: {}, syncFrom: DEV.name, syncAt: at.toISOString() });
  DEV.lastExport = at.toISOString(); saveDev(); DB.meta.lastBackup = at.toISOString(); save();
  if (IS_MOBILE) for (const type of ["application/json", "text/plain"]) {
    const file = new File([data], name, { type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: "مزامنة الجمعيات الأهلية" }); render(); toast("تم الإرسال"); return; }

}

function download(name, content, type){
  const blob = new Blob([content], { type });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function stamp(){ return new Date().toISOString().slice(0,10); }
function backup(){
  DB.meta.lastBackup = new Date().toISOString(); save();
  download(`نسخة احتياطية - الجمعيات الأهلية ${stamp()}.json`, JSON.stringify(DB, null, 1), "application/json");
  render(); toast("تم تصدير النسخة الاحتياطية");
}
function restore(){
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    f.text().then(t => {
      let d; try { d = JSON.parse(t); } catch (e) { return toast("الملف غير صالح"); }
      d = migrate(d);
      if (!d) return toast("هذا ليس ملف نسخة احتياطية لهذا التطبيق");

      DB = d; save(); render(); toast("تم الاستيراد بنجاح");

  };
  inp.click();
}
