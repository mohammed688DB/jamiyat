<style>
:root{--bg:#f2f6f8;--card:#fff;--ink:#1c2a33;--mut:#5d6e79;--line:#dbe3e8;--pri:#0b6a85;--pri2:#e2f0f5;--ok:#1d8048;--okbg:#e5f5ec;--warn:#9a6212;--warnbg:#fdf3e1;--bad:#b83227;--badbg:#fbe9e7;--hi:#fff7d6}
@media (prefers-color-scheme:dark){:root{--bg:#0f161b;--card:#172129;--ink:#e5edf1;--mut:#9aabb6;--line:#293842;--pri:#3aa6c4;--pri2:#163240;--ok:#4cc27f;--okbg:#14301f;--warn:#e0a84a;--warnbg:#33280f;--bad:#ef7a6e;--badbg:#3a1a17;--hi:#3a3412}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:15px;overflow-x:clip}
header{background:var(--pri);color:#fff;padding:12px 16px 0}
header h1{margin:0 0 2px;font-size:20px}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:58px;height:58px;flex:none;margin-bottom:8px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
header .sub{opacity:.85;font-size:13px;margin-bottom:10px}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{background:transparent;color:#fff;border:0;padding:9px 14px;border-radius:10px 10px 0 0;font:inherit;cursor:pointer;white-space:nowrap;opacity:.85}
nav button.on{background:var(--bg);color:var(--ink);opacity:1;font-weight:600}
main{max-width:1200px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.grid>*{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.card h2,.card h3{margin:0 0 10px;font-size:17px}
.mut{color:var(--mut)}.small{font-size:13px}
.big{font-size:19px;font-weight:700;margin:4px 0}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle;margin-left:6px}
.bar{height:8px;background:var(--pri2);border-radius:6px;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:var(--pri)}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600}
.b-ok{background:var(--okbg);color:var(--ok)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-bad{background:var(--badbg);color:var(--bad)}
.alert{padding:10px 12px;border-radius:10px;margin:8px 0;font-size:14px}
.alert.warn{background:var(--warnbg);color:var(--warn)}.alert.bad{background:var(--badbg);color:var(--bad)}.alert.info{background:var(--pri2)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:right;vertical-align:top}
th{background:var(--pri2);font-size:13px;white-space:nowrap}
td.n{white-space:nowrap;text-align:center}
tr.now td{background:var(--hi)}
tr.zero td{opacity:.5}
tr.click{cursor:pointer}tr.click:hover td{background:var(--pri2)}
tfoot td{font-weight:700}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:9px;cursor:pointer}
button:hover{border-color:var(--pri)}
button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
button.bad{color:var(--bad)}
button.ic{padding:3px 8px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
label{display:block;margin:8px 0;font-size:14px}
label.chk{display:flex;gap:6px;align-items:center}
input,select,textarea{font:inherit;width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);margin-top:3px}
input[type=checkbox]{width:auto;margin:0}
textarea{min-height:70px}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
.f2>*{min-width:0}
details summary{cursor:pointer;font-weight:600;padding:4px 0}
.units{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.units b{color:var(--pri)}
/* timeline */
.tl{margin-top:6px}
.tlr{display:flex;align-items:center;gap:8px;margin:3px 0}
.tld{width:62px;flex:none;font-size:13px;color:var(--mut)}
.tlb{position:relative;flex:1;height:26px;background:var(--pri2);border-radius:5px;overflow:hidden;min-width:0}
.seg{position:absolute;top:0;bottom:0;color:#fff;font-size:11px;line-height:26px;padding:0 4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-left:1px solid rgba(255,255,255,.6)}
.nowl{position:absolute;top:0;bottom:0;width:3px;background:#e11;box-shadow:0 0 0 1px #fff}
.tlx{position:relative;flex:1;height:16px;font-size:11px;color:var(--mut)}
.tlx span{position:absolute;transform:translateX(50%)}
/* modal */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:20}
#ov.on{display:flex}
#md{background:var(--card);border-radius:14px;padding:16px 18px;width:100%;max-width:560px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:9px;display:none;z-index:30}
#print{display:none}
/* التقارير */
:root{--pri3:#a9d6e3}
@media (prefers-color-scheme:dark){:root{--pri3:#24576a}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tiles>*{min-width:0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile .v{font-size:22px;font-weight:700}.tile .l{font-size:12px;color:var(--mut)}.tile .s{font-size:12px;color:var(--mut)}
.hb{display:flex;align-items:center;gap:8px;margin:5px 0}
.hbn{width:36%;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbt{flex:1;height:14px;min-width:0}
.hbt i{display:block;height:100%;background:var(--pri);border-start-end-radius:4px;border-end-end-radius:4px}
.hbt i.un{background:repeating-linear-gradient(45deg,var(--mut) 0 3px,transparent 3px 6px)}
.hbv{width:118px;flex:none;font-size:12px;color:var(--mut);white-space:nowrap}
.cc{display:flex;align-items:flex-end;gap:6px;height:190px;border-bottom:1px solid var(--line);padding-top:22px}
.ccc{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;min-width:0;cursor:default}
.ccc i{display:block}
.ccc i.p{background:var(--pri)}.ccc i.r{background:var(--pri3)}
.ccc i:first-of-type{border-radius:4px 4px 0 0}
.ccc i+i{margin-top:2px}
.ccv{position:absolute;left:0;right:0;text-align:center;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden}
.ccl{display:flex;gap:6px;font-size:11px;color:var(--mut);margin-top:4px}.ccl span{flex:1;text-align:center;min-width:0}
.lg{display:flex;gap:14px;font-size:12px;color:var(--mut);margin:6px 0}.lg b{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;margin-left:4px}
@media print{#print *{-webkit-print-color-adjust:exact;print-color-adjust:exact}#print button,#print select,#print .noprint{display:none!important}#print .card{border:1px solid #999;break-inside:avoid}#print .tile{border:1px solid #999}}
footer{text-align:center;color:var(--mut);font-size:12px;padding:10px 0 24px}
@media (max-width:600px){main{padding:10px}.card{padding:12px}th,td{padding:6px 4px;font-size:13px}.tld{width:46px;font-size:11px}}
@media print{
 @page{size:A4 landscape;margin:12mm}
 body{background:#fff;color:#000}
 body>*:not(#print){display:none!important}
 #print{display:block;font-size:13px}
 #print h1{text-align:center;font-size:22px;margin:0 0 10px}
 #print table{border:2px solid #000}
 #print th,#print td{border:1px solid #000;padding:5px;color:#000;background:#fff}
 #print th{background:#ddd!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .pfoot{display:flex;justify-content:space-between;margin-top:14px;gap:20px}
 .pfoot div{border:1px solid #000;padding:6px 10px}
}
</style>
</head>

<script>
const DAYS=['السبت','الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
const WEEK=10080, FULL=336, KEY='falaj_db_v1';
const TYPES=['بيع','إرث','هبة','تنازل','صلح','رهن','أخرى'];
const PAL=['#1f6fb2','#2c8a3a','#c0392b','#7d4fb0','#8a5a3c','#c2457f','#11869a','#8c8a12','#d4700f','#3d5a99','#5e8a26','#a8462f','#0e7d6f','#6b4f8f'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let _c=0;const uid=()=>Date.now().toString(36)+(_c++).toString(36)+Math.random().toString(36).slice(2,5);
const num=x=>Math.round((+x||0)*100)/100;
const fmtN=x=>String(num(x));
const today=()=>new Date().toISOString().slice(0,10);

/* ===== البيانات الأصلية (من ملف عرضت فلج الجل.xls + العروض) ===== */
function seed(){
 const mk=(id,name,kind)=>({id,name,kind,startDay:0,startTime:'07:30',notes:'',holders:[],original:[]});
 return {v:1,settings:{village:'ضبعة',writer:''},sources:[mk('falaj','فلج الجل','فلج'),mk('bilad','طوي البلاد','طوي'),mk('majnab','طوي المجناب','طوي')],log:[]};
}
const MOBILE=true;
const APPVER='2026-10-16 11:27';
function load(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}}
/* التخزين: ذاكرة الجهاز (IndexedDB — مساحة كبيرة ودائمة) + على الكمبيوتر: ملف على القرص يُحدَّث تلقائياً بعد كل تعديل */
const IDB={db:null,
 open(){return new Promise((res,rej)=>{const r=indexedDB.open('falaj_db',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(this.db=r.result);r.onerror=()=>rej(r.error)})},
 get(k){return new Promise((res,rej)=>{const r=this.db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
 set(k,v){return new Promise((res,rej)=>{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}};
let useIDB=false,fileH=null,filePerm=false,fileErr='',_chain=Promise.resolve(),_pending=false;
const canFile=()=>!MOBILE&&'showSaveFilePicker' in window;
function persist(){if(_pending)return;_pending=true;_chain=_chain.then(()=>{_pending=false;return flush()})}
function save(){DB.updated=Date.now();persist()}
async function flush(){
 try{if(useIDB)await IDB.set('db',DB);else localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('تعذّر الحفظ في ذاكرة الجهاز — احفظ نسخة احتياطية')}
 if(fileH&&filePerm){try{const w=await fileH.createWritable();await w.write(JSON.stringify(DB));await w.close();fileErr=''}catch(e){fileErr=e.message;filePerm=false;render()}}
}
async function pickFile(){
 try{const h=await window.showSaveFilePicker({suggestedName:'بيانات الفلج والطويان.json',types:[{description:'ملف بيانات الفلج والطويان',accept:{'application/json':['.json']}}]});
  fileH=h;filePerm=true;await IDB.set('fileH',h);await flush();render();toast('سيُحفظ تلقائياً في الملف: '+h.name)}
 catch(e){if(e.name!=='AbortError')alert('تعذّر اختيار الملف: '+e.message)}
}
async function regrant(){if(!fileH)return;try{filePerm=(await fileH.requestPermission({mode:'readwrite'}))==='granted'}catch(e){filePerm=false}if(filePerm){await flush();toast('تم — الحفظ التلقائي في الملف يعمل')}render()}
async function unlinkFile(){if(!confirm('إيقاف الحفظ التلقائي في الملف؟ (تبقى البيانات في ذاكرة الجهاز)'))return;fileH=null;filePerm=false;await IDB.set('fileH',null);render()}
function fileBanner(){return canFile()&&fileH&&!filePerm?`<div class="alert warn">الحفظ التلقائي في ملف الجهاز «${esc(fileH.name)}» متوقف حتى تسمح له. <button class="ic" onclick="regrant()">متابعة الحفظ في الملف</button></div>`:''}
const isEmpty=()=>DB.sources.every(s=>!s.holders.length);
const fmtDate=t=>t?new Date(t).toLocaleString('ar-OM',{dateStyle:'medium',timeStyle:'short'}):'غير معروف';
let DB=null; // يُحمَّل في boot()
function migrate(){DB.log=DB.log||[];DB.maint=DB.maint||[];DB.fund=DB.fund||[];DB.rahn=DB.rahn||[];DB.sales=DB.sales||[];DB.files=DB.files||{};DB.jams=DB.jams||[]}
const state={tab:'home',src:'falaj',q:''};
const getS=id=>DB.sources.find(s=>s.id===id);

/* ===== الوقت ===== */
const tmin=s=>{const[a,b]=String(s||'0:0').split(':').map(Number);return (a||0)*60+(b||0)};
const total=s=>num(s.holders.reduce((a,h)=>a+(+h.athar||0),0));
function sched(s){let t=s.startDay*1440+tmin(s.startTime);return s.holders.filter(h=>h.athar>0).map(h=>{const d=h.athar*30,r={h,start:t,end:t+d,dur:d};t+=d;return r})}
function point(abs){
 const m=((Math.round(abs)%WEEK)+WEEK)%WEEK,d=Math.floor(m/1440),hm=m%1440,H=Math.floor(hm/60),M=hm%60;
 let p,dn=DAYS[d];
 if(H<4){p='ليلة';dn=DAYS[(d+6)%7]}else if(H<6)p='فجر';else if(H<11)p='صباح';else if(H<15)p='ظهر';else if(H<18)p='عصر';else if(H<21)p='مساء';else p='ليلة';
 return `${p} ${dn} الساعة ${H%12||12}${M?':'+String(M).padStart(2,'0'):''}`;
}
const span=r=>`يبدأ ${point(r.start)} وينتهي ${point(r.end)}`;
function hrs(h){return h===1?'ساعة':h===2?'ساعتان':h<=10?h+' ساعات':h+' ساعة'}
function durText(min){
 min=Math.round(min);const h=Math.floor(min/60),m=min%60;
 const mp=m===30?'نصف':m===15?'ربع':m+' دقيقة';
 if(!h)return m===30?'نصف ساعة':m===15?'ربع ساعة':m+' دقيقة';
 return m?`${hrs(h)} و${mp}`:hrs(h);
}
function nowAbs(){const d=new Date();return ((d.getDay()+1)%7)*1440+d.getHours()*60+d.getMinutes()+d.getSeconds()/60}
function current(s){
 const S=sched(s),n=nowAbs();
 for(let i=0;i<S.length;i++){const r=S[i],into=((n-r.start)%WEEK+WEEK)%WEEK;if(into<r.dur)return{r,next:S[(i+1)%S.length],left:r.dur-into,into}}
 let best=null,bd=1e9;for(const r of S){const w=((r.start-n)%WEEK+WEEK)%WEEK;if(w<bd){bd=w;best=r}}
 return{r:null,next:best,left:bd};
}

/* ===== أدوات ===== */
function names(){const a=[];DB.sources.forEach(s=>s.holders.forEach(h=>{if(!a.includes(h.name))a.push(h.name)}));return a}
function aliasOf(n){const a=new Set();DB.sources.forEach(s=>s.holders.forEach(h=>{if(h.name===n&&h.alias)a.add(h.alias)}));return [...a].join('، ')}
function col(h){if(h.unowned)return'#8d989f';const i=names().indexOf(h.name);return PAL[(i<0?0:i)%PAL.length]}
const short=n=>n.replace(/ المقبالي| الخاطري/g,'').split(' ').slice(0,4).join(' ');
function statusBadge(s){const t=total(s);return t===FULL?`<span class="badge b-ok">${fmtN(t)} أثر — أسبوع كامل</span>`:`<span class="badge b-bad">${fmtN(t)} أثر — ${t<FULL?'ناقص':'زائد'} ${fmtN(Math.abs(FULL-t))}</span>`}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600)}
function modal(h){$('#md').innerHTML=h;$('#ov').classList.add('on')}
function closeModal(){$('#ov').classList.remove('on')}
function download(data,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function activeRahn(sid,name){return DB.log.filter(e=>e.type==='رهن'&&e.active&&e.sources.includes(sid)&&e.from===name)}

/* ===== العرض ===== */
const TABS=[['home','الرئيسية'],['src','العرضة والجدول'],['own','الملّاك'],['mt','الصيانة'],['el','الكهرباء'],['fd','مبالغ الأموال'],['un','الأثار غير المملوكة'],['rep','الإحصائيات والتقارير'],['tr','نقل الملكية والسجل'],['set','الإعدادات والنسخ']];
function render(){
 ensureJams();ensureRahn();
 $('#sub').textContent='بلدة '+DB.settings.village+' — فلج الجل · طوي البلاد · طوي المجناب';
 $('#nav').innerHTML=TABS.map(([k,v])=>`<button class="${state.tab===k?'on':''}" onclick="go('${k}')">${v}</button>`).join('');
 $('#dl_names').innerHTML=names().map(n=>`<option value="${esc(n)}">`).join('');
 $('#main').innerHTML=fileBanner()+({home:vHome,src:vSrc,own:vOwn,mt:vMt,el:vElec,fd:vFund,un:vUn,rep:vRep,tr:vTr,set:vSet})[state.tab]();

function timeline(s){
 const S=sched(s),n=nowAbs();let h='<div class="tl">';
 for(let d=0;d<7;d++){
  const a=d*1440,b=a+1440;let segs='';
  S.forEach(r=>{for(const k of[-WEEK,0,WEEK]){const s0=Math.max(r.start+k,a),e0=Math.min(r.end+k,b);
   if(e0>s0){const w=(e0-s0)/1440*100;segs+=`<div class="seg" style="right:${((s0-a)/1440*100).toFixed(3)}%;width:${w.toFixed(3)}%;background:${col(r.h)}" title="${esc(r.h.name)} — ${esc(span(r))}">${w>8?esc(short(r.h.name)):''}</div>`}}});
  const nm=(n>=a&&n<b)?`<div class="nowl" style="right:${((n-a)/1440*100).toFixed(2)}%"></div>`:'';
  h+=`<div class="tlr"><div class="tld">${DAYS[d]}</div><div class="tlb">${segs}${nm}</div></div>`;
 }
 h+=`<div class="tlr"><div class="tld"></div><div class="tlx">${[0,6,12,18,24].map(x=>`<span style="right:${x/24*100}%">${x%12||12}${x===12?'ظ':x<12||x===24?'ص':'م'}</span>`).join('')}</div></div></div>`;
 return h;
}

 srcs.forEach(id=>{const s=getS(id),f=s.holders.find(h=>h.name===from);if(!f)errs.push(`${s.name}: لا يوجد مالك باسم «${from}»`);else if(f.athar<a-1e-9)errs.push(`${s.name}: «${from}» يملك ${fmtN(f.athar)} أثر فقط`)});

const r3=x=>Math.round((+x||0)*1000)/1000;
const money=x=>r3(x).toFixed(3);
const shPaid=x=>r3((x.pays||[]).reduce((a,p)=>a+p.a,0));
const jobPaid=j=>r3(j.shares.reduce((a,x)=>a+shPaid(x),0));
const jobAthar=j=>num(j.shares.reduce((a,x)=>a+x.athar,0))||1;
function divide(amount,list){ // list: [{name,athar,pays?}] — الحصة = المبلغ × الأثار ÷ المجموع، وفرق التقريب على أكبر حصة
 const T=list.reduce((a,x)=>a+x.athar,0);if(!T)return list;
 list.forEach(x=>x.amt=r3(amount*x.athar/T));
 const diff=r3(amount-list.reduce((a,x)=>a+x.amt,0));
 if(diff){const big=list.reduce((a,b)=>b.athar>a.athar?b:a);big.amt=r3(big.amt+diff)}
 return list;
}
function holdersFor(s,incl){ // من يتحمّل المطالب: الملّاك + المرتهنون عن الأثار غير المملوكة المرهونة (+ الباقي غير المملوك إن طُلب)
 const L=s.holders.filter(h=>h.athar>0&&!h.unowned).map(h=>({name:h.name,athar:+h.athar,amt:0,pays:[]}));
 rahnActive(s.id).forEach(m=>{const to=curP(m).to;let x=L.find(y=>y.name===to);if(!x){x={name:to,athar:0,amt:0,pays:[]};L.push(x)}x.athar=num(x.athar+m.athar);x.rahn=num((x.rahn||0)+m.athar)});
 const free=freeOf(s);if(incl&&free>0)L.push({name:'أثار غير مملوكة',athar:free,amt:0,pays:[]});
 return L;
}
function dues(){const m=new Map();DB.maint.forEach(j=>j.shares.forEach(x=>{const r=r3(x.amt-shPaid(x));if(r>0)m.set(x.name,r3((m.get(x.name)||0)+r))}));return [...m].sort((a,b)=>b[1]-a[1])}

 return [...DB.fund,...J].filter(t=>!sf||sf==='all'||t.src===sf);
}

function fUpd(){const s=getS($('#f_src').value);$('#f_bal').textContent=`الرصيد الحالي: ${money(fundBal(s.id))} ر.ع`}

 <label>المال (المزرعة / النخل / الضاحية)<input id="f_prop" list="dl_props"></label>

 <label>البيان / ملاحظات<input id="f_note" placeholder="${inn?'مثال: طناء نخل الضاحية الشرقية':'مثال: إصلاح ساقية المزرعة'}"></label></div>

function addFund(){
 const inn=(state.fdir||'in')==='in',src=$('#f_src').value,s=getS(src),a=r3($('#f_a').value);

 DB.fund.unshift({id:uid(),src,dir:inn?'in':'out',type:$('#f_type').value,amount:a,date:$('#f_d').value,prop:$('#f_prop').value.trim(),party:$('#f_p').value.trim(),period:inn?$('#f_per').value.trim():'',note:$('#f_note').value.trim(),at:Date.now()});

/* ----- جمعية الفلج / الطوي: مبلغ شهري يُحصّل من الملّاك حسب الأثار، لفترة محددة أو مفتوحة؛ المحصّل يدعم رصيد الأموال -----
   كل شهر يُنشأ قسط (DB.maint بنوع jam) تلقائياً حتى الشهر الحالي، بحسب الملكية وقت إنشائه */
const ymNow=()=>today().slice(0,7);
const ymAdd=(ym,k)=>{let[y,m]=ym.split('-').map(Number);m+=k;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return `${y}-${String(m).padStart(2,'0')}`};
const ymTxt=ym=>ym?`${MONTHS[+ym.slice(5)-1]} ${ym.slice(0,4)}`:'';
const planJobs=p=>DB.maint.filter(j=>j.plan===p.id).sort((a,b)=>a.year-b.year||a.month-b.month);
function planAmount(p,s){if(p.mode!=='rate')return p.amount;return r3(p.amount*holdersFor(s,p.incl).reduce((a,x)=>a+x.athar,0))}
function planStatus(p){const n=ymNow();if(p.end&&p.end<n)return['منتهية','b-warn'];if(p.start>n)return['لم تبدأ','b-warn'];return[p.end?'جارية حتى '+ymTxt(p.end):'جارية — مفتوحة','b-ok']}
function ensureJams(){ // ينشئ أقساط الشهور المستحقة
 let made=0;const n=ymNow();
 DB.jams.forEach(p=>{const s=getS(p.src);if(!s)return;const last=p.end&&p.end<n?p.end:n;
  for(let ym=p.start;ym<=last;ym=ymAdd(ym,1)){
   const y=+ym.slice(0,4),m=+ym.slice(5);if((p.skip||[]).includes(ym)||DB.maint.some(j=>j.plan===p.id&&j.year===y&&j.month===m))continue;
   const L=holdersFor(s,p.incl);if(!L.length)break;const a=planAmount(p,s);
   DB.maint.push({id:uid(),kind:'jam',plan:p.id,src:p.src,year:y,month:m,title:`${p.title} — ${MONTHS[m-1]} ${y}`,amount:a,date:`${ym}-01`,note:'',incl:p.incl,shares:divide(a,L),at:Date.now()});made++}});
 if(made)save();
}
function jamSection(sf){
 const def=sf==='all'?state.src:sf,P=DB.jams.filter(p=>sf==='all'||p.src===sf);
 let h=`<div class="card"><h2>جمعية الفلج / الطوي</h2><div class="small mut">مبلغ شهري يُحصّل من الملّاك حسب الأثار، لفترة محددة (أشهر أو سنوات) أو مفتوحة. يُنشأ قسط كل شهر تلقائياً، وما يُحصّل يدخل في رصيد الأموال.</div>
 <div class="f2"><label>الفلج / الطوي<select id="j_src" onchange="jamPrev()">${DB.sources.map(s=>`<option value="${s.id}" ${s.id===def?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>
 <label>اسم الجمعية<input id="j_t" placeholder="مثال: جمعية دعم أموال الفلج"></label>
 <label>طريقة التحديد<select id="j_mode" onchange="jamPrev()"><option value="total">مبلغ شهري كلي يُقسم على الأثار</option><option value="rate">مبلغ شهري لكل أثر</option></select></label>
 <label>المبلغ (ر.ع)<input id="j_a" type="number" step="0.001" min="0" oninput="jamPrev()"></label>
 <label>من شهر<input id="j_s" type="month" value="${ymNow()}"></label>
 <label>إلى شهر (اتركه فارغاً إذا كانت مفتوحة)<input id="j_e" type="month"></label></div>
 <label class="chk"><input id="j_u" type="checkbox" onchange="jamPrev()"> تُحسب حصة على الأثار غير المملوكة غير المرهونة أيضاً</label>
 <div id="j_prev" class="small" style="margin:6px 0"></div>
 <div class="row"><button class="pri" onclick="addJam()">إنشاء الجمعية</button></div>`;
 if(P.length)h+=`<div class="tw" style="margin-top:8px"><table><thead><tr><th>الجمعية</th><th>المصدر</th><th>القسط الشهري</th><th>الفترة</th><th>الأشهر</th><th>المحصّل</th><th>المتبقي</th><th>الحالة</th></tr></thead><tbody>
 ${P.map(p=>{const J=planJobs(p),a=r3(J.reduce((x,j)=>x+j.amount,0)),pd=r3(J.reduce((x,j)=>x+jobPaid(j),0)),st=planStatus(p);
  return `<tr class="click" onclick="state.jp='${p.id}';state.jy=null;render();scrollTo(0,0)"><td>${esc(p.title)}</td><td>${esc(getS(p.src)?.name||'')}</td><td class="n">${p.mode==='rate'?money(p.amount)+' لكل أثر':money(p.amount)}</td><td class="small">${ymTxt(p.start)} — ${p.end?ymTxt(p.end):'مفتوحة'}</td><td class="n">${J.length}</td><td class="n">${money(pd)}</td><td class="n">${a-pd>0?`<span class="badge b-warn">${money(a-pd)}</span>`:'—'}</td><td><span class="badge ${st[1]}">${esc(st[0])}</span></td></tr>`}).join('')}
 </tbody></table></div><div class="small mut">اضغط على الجمعية لعرض كشف الأشهر وتسجيل التسديد.</div>`;
 const old=DB.maint.filter(j=>isJam(j)&&!j.plan&&(sf==='all'||j.src===sf));
 if(old.length)h+=`<div class="small" style="margin-top:8px">جمعيات سابقة لمرة واحدة: ${old.map(j=>`<button class="ic" onclick="state.mt='${j.id}';render()">${esc(j.title)}</button>`).join(' ')}</div>`;
 setTimeout(()=>$('#j_src')&&jamPrev());
 return h+'</div>';
}
function jamPrev(){
 const s=getS($('#j_src').value),a=+$('#j_a').value,L=holdersFor(s,$('#j_u').checked),T=num(L.reduce((x,h)=>x+h.athar,0));
 if(!T){$('#j_prev').textContent='لا يوجد ملّاك';return}
 const rate=$('#j_mode').value==='rate';
 $('#j_prev').innerHTML=`يُقسم على ${L.length} مالك — ${fmtN(T)} أثر${a>0?(rate?` — <b>القسط الشهري الكلي = ${money(a*T)} ر.ع</b>`:` — <b>على كل أثر ${money(a/T)} ر.ع شهرياً</b>`):''}`;
}
function addJam(){
 const s=getS($('#j_src').value),t=$('#j_t').value.trim(),a=r3($('#j_a').value),start=$('#j_s').value,end=$('#j_e').value;
 if(!t)return alert('اكتب اسم الجمعية');

/* ----- الرهن: قسط مرة واحدة أو سنوي أو شهري؛ القسط يتكرر على المرتهن كل سنة/شهر حتى الفك أو النقل، والمدفوع يدخل الرصيد -----
   الأقساط تُنشأ تلقائياً (ensureRahn) كبنود في DB.maint بنوع rahn وحصة واحدة باسم المرتهن */
const FREQ={once:'مرة واحدة',year:'سنوي',month:'شهري'},FREQ_UNIT={once:'',year:' سنوياً',month:' شهرياً'};
function addPeriod(d,freq,k){const[y,m,da]=d.split('-').map(Number),t=m-1+k*(freq==='year'?12:1),y2=y+Math.floor(t/12),m2=(t%12+12)%12+1,dim=new Date(y2,m2,0).getDate();return `${y2}-${String(m2).padStart(2,'0')}-${String(Math.min(da,dim)).padStart(2,'0')}`}
const rahnJobs=m=>DB.maint.filter(j=>j.rahn===m.id).sort((a,b)=>String(a.date).localeCompare(b.date));
function ensureRahn(){
 let made=0;const t=today();
 DB.rahn.forEach(m=>{
  const P=m.periods,rel=m.status!=='active'?((P.find(q=>q.kind==='فك')||{}).start||'0000'):null;
  P.forEach((p,pi)=>{
   if(p.kind==='فك'||!(p.amount>0)||!p.start)return;
   const nx=P.slice(pi+1).find(q=>q.start),stop=nx?nx.start:null,f=p.freq||'once';
   for(let k=0,d=p.start;;k++,d=addPeriod(p.start,f,k)){
    if(d>t||(p.end&&d>p.end)||(stop&&d>=stop)||(rel&&d>=rel))break;
    if(!(m.skip||[]).includes(pi+'|'+d)&&!DB.maint.some(j=>j.rahn===m.id&&j.pi===pi&&j.date===d)){
     const s=getS(m.src);
     DB.maint.push({id:uid(),kind:'rahn',rahn:m.id,pi,src:m.src,year:+d.slice(0,4),month:+d.slice(5,7),date:d,
      title:`${f==='once'?'رهن':'قسط رهن '+FREQ[f]} ${fmtN(m.athar)} أثر غير مملوكة — ${s?s.name:''} — ${f==='month'?ymTxt(d.slice(0,7)):d}`,
      amount:p.amount,note:'',shares:[{name:p.to,athar:m.athar,amt:p.amount,pays:[]}],at:Date.now()});made++}
    if(f==='once')break;
   }
  })});
 if(made)save();
}

}

/* صورة العرضة (PNG) للمشاركة في الواتساب — تُرسم على canvas */
const pt=a=>point(a).replace(' الساعة','');
function srcCanvas(s){
 const S=sched(s),W=1400,P=40,RH=60,TOP=176,TH=52,K=2;
 const C=[['ت',60,'c'],['الاسم',440,'r'],['الأثار',110,'c'],['المدة',200,'c'],['يبدأ',255,'c'],['ينتهي',255,'c']];
 const tableH=TH+S.length*RH+RH,H=TOP+tableH+44+60+150;
 const cv=document.createElement('canvas');cv.width=W*K;cv.height=H*K;
 const g=cv.getContext('2d');g.scale(K,K);g.direction='rtl';g.textBaseline='middle';
 const F=(w,sz)=>`${w} ${sz}px "Segoe UI",Tahoma,Arial,sans-serif`;
 const fit=(t,x,y,max,w,sz,al)=>{let z=sz;g.font=F(w,z);while(g.measureText(t).width>max&&z>11){z--;g.font=F(w,z)}g.textAlign=al;g.fillText(t,x,y)};
 const rr=(x,y,w,h,r)=>{g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()};
 // الخلفية والترويسة
 g.fillStyle='#f4f8fa';g.fillRect(0,0,W,H);
 const gr=g.createLinearGradient(0,0,W,0);gr.addColorStop(0,'#0e8aa8');gr.addColorStop(1,'#0b5f78');g.fillStyle=gr;g.fillRect(0,0,W,140);
 g.fillStyle='#fff';fit(`عرضة ${s.name}`,W-P,52,W-2*P,'bold',42,'right');
 g.globalAlpha=.88;fit(`بلدة ${DB.settings.village} — الدور الأسبوعي يبدأ ${pt(s.startDay*1440+tmin(s.startTime))} ويتكرر كل أسبوع`,W-P,102,W-2*P-260,'normal',22,'right');
 g.globalAlpha=1;fit(`${fmtN(total(s))} أثر · ${durText(total(s)*30)}`,P,102,260,'bold',22,'left');
 // الجدول
 const X0=P,X1=W-P;let y=TOP;
 g.fillStyle='#fff';rr(X0,y,X1-X0,tableH,14);g.fill();g.strokeStyle='#d5e2e8';g.lineWidth=1;g.stroke();
 g.save();rr(X0,y,X1-X0,tableH,14);g.clip();
 g.fillStyle='#0b6a85';g.fillRect(X0,y,X1-X0,TH);
 let x=X1;g.fillStyle='#fff';C.forEach(([t,w])=>{fit(t,x-w/2,y+TH/2,w-10,'bold',21,'center');x-=w});
 y+=TH;
 S.forEach((r,i)=>{
  if(i%2){g.fillStyle='#f2f8fa';g.fillRect(X0,y,X1-X0,RH)}
  const un=r.h.unowned,ink=un?'#7a8890':'#1c2a33';let x=X1;
  const cells=[String(i+1),r.h.name,fmtN(r.h.athar),durText(r.dur),pt(r.start),pt(r.end)];
  C.forEach(([t,w,al],k)=>{
   if(k===1){g.fillStyle=col(r.h);g.beginPath();g.arc(x-22,y+RH/2,7,0,7);g.fill();g.fillStyle=ink;
    if(r.h.note){fit(cells[1],x-38,y+RH/2-10,w-48,'bold',21,'right');g.fillStyle='#6b7c86';fit(r.h.note,x-38,y+RH/2+15,w-48,'normal',14,'right')}
    else fit(cells[1],x-38,y+RH/2,w-48,'bold',21,'right')}
   else{g.fillStyle=k===0?'#6b7c86':ink;fit(cells[k],x-w/2,y+RH/2,w-14,k===2?'bold':'normal',k>=4?18:20,'center')}
   x-=w});
  g.strokeStyle='#e6eef2';g.beginPath();g.moveTo(X0,y+RH);g.lineTo(X1,y+RH);g.stroke();y+=RH});
 g.fillStyle='#e2f0f5';g.fillRect(X0,y,X1-X0,RH);g.fillStyle='#0b4f63';
 fit('المجموع',X1-60-38,y+RH/2,300,'bold',22,'right');fit(fmtN(total(s)),X1-500-55,y+RH/2,100,'bold',22,'center');fit(durText(total(s)*30),X1-610-100,y+RH/2,190,'bold',20,'center');
 g.restore();
 // شريط الأسبوع: كل يوم بلون صاحب الدور (السبت يميناً)
 y=TOP+tableH+44;const BW=X1-X0,wk=t=>X1-(((t%WEEK)+WEEK)%WEEK)/WEEK*BW;
 g.fillStyle='#5d6e79';fit('الأسبوع',X1,y-18,200,'bold',16,'right');
 g.save();rr(X0,y,BW,30,8);g.clip();g.fillStyle='#e2edf1';g.fillRect(X0,y,BW,30);
 S.forEach(r=>{for(const k of[-WEEK,0,WEEK]){const a=Math.max(r.start+k,0),b=Math.min(r.end+k,WEEK);if(b>a){g.fillStyle=col(r.h);g.fillRect(X1-b/WEEK*BW,y,(b-a)/WEEK*BW-1.5,30)}}});
 g.restore();
 for(let d=0;d<7;d++){const xa=X1-d/7*BW;g.strokeStyle='#ffffff';g.lineWidth=2;if(d){g.beginPath();g.moveTo(xa,y-4);g.lineTo(xa,y+34);g.stroke()}g.fillStyle='#5d6e79';fit(DAYS[d],xa-BW/14,y+50,BW/7-6,'normal',15,'center')}
 // التذييل
 y+=90;g.fillStyle='#fff';rr(X0,y,BW,96,12);g.fill();g.strokeStyle='#d5e2e8';g.stroke();
 g.fillStyle='#0b6a85';fit('أثر الماء = نصف ساعة  ·  نصف أثر = ربع ساعة  ·  البادة = 24 أثر  ·  البادة المغلقة = 48 أثر',X1-24,y+30,BW-48,'bold',19,'right');
 g.fillStyle='#5d6e79';fit(`${DB.settings.writer?'كتب هذه العريضة: '+DB.settings.writer+'  ·  ':''}تاريخ الإصدار: ${today()}`,X1-24,y+68,BW-48,'normal',17,'right');
 return cv;
}

 <div class="small mut" id="st_est"></div>
 <div class="small mut">إصدار التطبيق: ${esc(APPVER)}${MOBILE?' <button class="ic" onclick="checkUpd()">البحث عن تحديث</button>':''}</div>
 ${canFile()?`<div style="margin-top:10px">${fileH?`📁 وتُحفظ أيضاً تلقائياً بعد كل تعديل في الملف: <b>${esc(fileH.name)}</b> ${filePerm?'<span class="badge b-ok">يعمل</span>':'<span class="badge b-warn">متوقف</span>'}${fileErr?`<div class="small" style="color:var(--bad)">${esc(fileErr)}</div>`:''}
  <div class="row">${filePerm?'':'<button class="pri" onclick="regrant()">متابعة الحفظ في الملف</button>'}<button onclick="pickFile()">تغيير الملف</button><button onclick="unlinkFile()">إيقاف</button></div>`
  :`<div class="small">يمكنك أيضاً حفظ نسخة تلقائية في ملف على الكمبيوتر (مثلاً داخل مجلد «قاعدة البيانات للفلج وطويان البلاد») تتحدّث بعد كل تعديل:</div><div class="row"><button class="pri" onclick="pickFile()">اختيار ملف الحفظ على الجهاز</button></div>`}</div>`:''}
 </div>
 <div class="card"><h2>المزامنة والنسخ الاحتياطي</h2>
 <div class="small mut">آخر تعديل على هذا الجهاز: ${fmtDate(DB.updated)}</div>
 <div class="row"><button class="pri" onclick="backup()">إرسال البيانات / حفظ نسخة</button><button onclick="$('#imp').click()">استلام البيانات / استرجاع نسخة</button><input id="imp" type="file" accept=".json,application/json,text/plain,*/*" style="display:none" onchange="restore(this.files[0])"><button onclick="exportXls()">تصدير إلى Excel</button></div>
 <div class="small mut">لنقل البيانات بين الكمبيوتر والجوال: اضغط «إرسال البيانات» على الجهاز الذي عدّلت فيه، وأرسل الملف لنفسك، ثم «استلام البيانات» على الجهاز الآخر. الاستلام يستبدل بيانات الجهاز بالملف، فعدّل على جهاز واحد في كل مرة.</div></div>
 ${MOBILE?'':`<div class="card"><h2>إعادة البيانات الأصلية</h2><div class="small mut">يمسح كل التعديلات والسجل ويرجع البيانات كما في ملف Excel والعروض.</div><div class="row"><button class="bad" onclick="if(confirm('مسح كل التعديلات والرجوع للبيانات الأصلية؟')){DB=seed();save();render();toast('تمت الإعادة')}">إعادة البيانات الأصلية</button></div></div>`}`;
}
async function backup(){
 if(!DB.updated)save();
 const name=`الفلج والطويان - ${today()}.json`,data=JSON.stringify(DB,null,1);
 try{const f=new File([data],name,{type:'application/json'});
  if(MOBILE&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'بيانات الفلج والطويان'});return}}catch(e){if(e&&e.name==='AbortError')return}
 download(data,name,'application/json');toast('تم حفظ الملف');
}
function applyData(text){
 let d;try{d=JSON.parse(text);if(!d||!Array.isArray(d.sources)||!d.settings)throw 0}catch(e){alert('الملف غير صالح');return}
 let msg=`استبدال بيانات هذا الجهاز ببيانات الملف؟\n\nتاريخ الملف: ${fmtDate(d.updated)}\nبيانات هذا الجهاز: ${fmtDate(DB.updated)}`;
 if(!isEmpty()&&DB.updated&&d.updated&&d.updated<DB.updated)msg='⚠ هذا الملف أقدم من البيانات الموجودة على هذا الجهاز!\n\n'+msg;
 if(!isEmpty()&&!confirm(msg))return;
 d.updated=d.updated||Date.now();DB=d;migrate();persist();
 state.tab='home';render();toast('تم استلام البيانات');
}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>applyData(r.result);r.readAsText(f)}
function exportXls(){
 const ws=[];
 DB.sources.forEach(s=>{ws.push([s.name,[['ت','الاسم','عدد الأثار','عدد الساعات','الوقت','ملاحظات'],...sched(s).map((r,i)=>[i+1,r.h.name,r.h.athar,durText(r.dur),span(r),r.h.note]),['','المجموع',total(s),durText(total(s)*30),'','']]])});
 ws.push(['الملّاك',[['الاسم',...DB.sources.map(s=>s.name),'المجموع'],...names().map(n=>{const v=DB.sources.map(s=>{const x=s.holders.find(h=>h.name===n);return x?x.athar:0});return [n,...v,num(v.reduce((a,b)=>a+b,0))]})]]);
 ws.push(['الصيانة والكهرباء',[['التاريخ','المصدر','البيان','المبلغ الكلي','سعر الأثر','المالك','الأثار','الحصة','المدفوع','المتبقي'],...DB.maint.flatMap(j=>j.shares.map(x=>[j.date,getS(j.src)?.name||'',j.title,j.amount,r3(j.amount/jobAthar(j)),x.name,x.athar,x.amt,shPaid(x),r3(x.amt-shPaid(x))]))]]);
 ws.push(['مبالغ الأموال',[['التاريخ','المصدر','الحركة','النوع','المال','الجهة / الشخص','المدة','وارد','منصرف','البيان'],...allFund().sort((a,b)=>String(a.date).localeCompare(b.date)).map(t=>[t.date,getS(t.src)?.name||'',t.dir==='in'?'وارد':'منصرف',t.type,t.prop||'',t.party||'',t.period||'',t.dir==='in'?t.amount:'',t.dir==='out'?t.amount:'',t.note])]]);
 ws.push(['بيع الأثار غير المملوكة',[['التاريخ','المصدر','الأثار','المشتري','الثمن','رقم العقد','ملاحظات'],...DB.sales.map(x=>[x.date,getS(x.src)?.name||'',x.athar,x.buyer,x.price,x.contract||'',x.note||''])]]);
 ws.push(['رهن الأثار غير المملوكة',[['المصدر','الأثار','الحالة','العملية','المرتهن','القسط','نوع القسط','من','إلى','رقم العقد','ملاحظات'],...DB.rahn.flatMap(m=>m.periods.map(p=>[getS(m.src)?.name||'',m.athar,m.status==='active'?'قائم':'مفكوك',p.kind,p.to,p.amount||0,p.kind==='فك'?'':FREQ[p.freq||'once'],p.start||'',p.end||'',p.contract||'',p.note||'']))]]);
 ws.push(['المستحقات',[['المالك','المتبقي عليه (ر.ع)'],...dues()]]);
 ws.push(['السجل',[['التاريخ','النوع','من','إلى','الأثار','في','ملاحظات'],...DB.log.map(e=>[e.date,e.type,e.from,e.to,e.athar,e.sources.map(id=>getS(id)?.name||id).join('، '),e.note])]]);
 DB.sources.forEach(s=>ws.push(['العرضة الأصلية - '+s.name,[['ت','الاسم في الأصل','عدد الأثار','من ورثه أو يدير الماء (الأصل)','الاسم المحدّث','من يدير الماء الآن','تاريخ التحديث','ملاحظة'],...s.original.map((o,i)=>[i+1,o.n,o.a,o.h,o.u?o.u.n||'':'',o.u?o.u.h||'':'',o.u?o.u.d||'':'',o.u?o.u.note||'':''])]]));
 const cell=v=>`<Cell><Data ss:Type="${typeof v==='number'?'Number':'String'}">${esc(v)}</Data></Cell>`;
 const x=`<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet" xmlns:x="urn:schemas-microsoft-com:office:excel">`+
  ws.map(([n,rows])=>`<Worksheet ss:Name="${esc(n.slice(0,31))}"><Table>${rows.map(r=>`<Row>${r.map(cell).join('')}</Row>`).join('')}</Table><WorksheetOptions xmlns="urn:schemas-microsoft-com:office:excel"><DisplayRightToLeft/></WorksheetOptions></Worksheet>`).join('')+`</Workbook>`;
 download(x,`الفلج والطويان - ${today()}.xls`,'application/vnd.ms-excel');
}

addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
setInterval(()=>{if(DB&&state.tab==='home'&&!$('#ov').classList.contains('on'))render()},30000);
async function boot(){
 try{await Promise.race([IDB.open(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),4000))]);useIDB=true;DB=await IDB.get('db')||null;fileH=await IDB.get('fileH')||null}catch(e){useIDB=false}
 let moved=false;
 if(!DB){DB=load();moved=!!DB&&useIDB} // نقل البيانات القديمة من تخزين المتصفح المحدود
 if(!DB)DB=seed();
 migrate();
 if(useIDB){await IDB.set('db',DB).catch(()=>{});if(moved)try{localStorage.removeItem(KEY)}catch(e){}}
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
 if(fileH&&canFile()){try{filePerm=(await fileH.queryPermission({mode:'readwrite'}))==='granted'}catch(e){filePerm=false}}
 render();
 if(MOBILE&&location.protocol.startsWith('http'))mobileInit();
}
boot();
async function checkUpd(){
 if(!('serviceWorker' in navigator))return;toast('جارٍ البحث عن تحديث…');
 try{const r=await navigator.serviceWorker.getRegistration();if(r){await r.update();setTimeout(()=>{if(!$('#upd'))toast('التطبيق محدّث — لا يوجد إصدار أحدث')},4000)}}catch(e){toast('تعذّر الاتصال — تأكد من الإنترنت')}
}
function showUpdate(){
 if($('#upd'))return;
 document.body.insertAdjacentHTML('beforeend',`<div id="upd" style="position:fixed;left:12px;right:12px;bottom:14px;z-index:40;background:#0b6a85;color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.3)">
 <div style="flex:1"><b>يوجد تحديث جديد للتطبيق</b><div style="font-size:12px;opacity:.85">بياناتك محفوظة ولن تتأثر</div></div>
 <button style="background:#fff;color:#0b6a85;border:0;font-weight:700" onclick="location.reload()">تحديث الآن</button>
 <button style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5)" onclick="$('#upd').remove()">لاحقاً</button></div>`);
}
function mobileInit(){
 // التحديث: عند رفع نسخة جديدة على GitHub يُحمَّل في الخلفية ثم يظهر شريط «يوجد تحديث جديد» يحدّث بضغطة
 if('serviceWorker' in navigator){
  const had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)showUpdate()});
  navigator.serviceWorker.register('sw.js').then(reg=>{
   const check=()=>reg.update().catch(()=>{});
   check();setInterval(check,30*60*1000);
   document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check()});
  }).catch(()=>{});
 }
 // ملف مُشارك من واتساب ← «الفلج والطويان»
 if(/[?&]shared=1/.test(location.search)&&'caches' in window){
  history.replaceState(null,'',location.pathname);
  caches.open('falaj-share').then(async c=>{const k=new URL('shared-file',location.origin+location.pathname).href,r=await c.match(k);
   if(r){const t=await r.text();await c.delete(k);applyData(t)}}).catch(()=>{});
 }
}
</script>
