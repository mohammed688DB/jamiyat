<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الجمعيات الأهلية</title>
<meta name="theme-color" content="#1f6f6b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الجمعيات">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --page:#f5f4f0; --surface:#ffffff; --surface-2:#f9f8f5; --line:#e4e2dc; --line-2:#d3d0c7;
  --ink:#1b1b19; --ink-2:#55534e; --muted:#8a877f;
  --aza:#1f6f6b; --aza-soft:#e3f0ee; --majlis:#8a5a1c; --majlis-soft:#f5ecdd;
  --accent:var(--aza); --accent-soft:var(--aza-soft);
  --s1:#2a78d6; --s2:#eb6834;
  --good:#0c7a0c; --good-soft:#e6f4e6; --bad:#c23535; --bad-soft:#fbe9e9; --warn:#a86b00; --warn-soft:#fdf3dc;
  --r:10px; --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 10px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
html,body{margin:0}
body{overflow-x:clip}
body{background:var(--page);color:var(--ink);font-family:Tajawal,"Segoe UI",Tahoma,Arial,sans-serif;font-size:15px;line-height:1.55}
body.aza{--accent:var(--aza);--accent-soft:var(--aza-soft)}
body.majlis{--accent:var(--majlis);--accent-soft:var(--majlis-soft)}
body.rosca{--accent:#3d4f91;--accent-soft:#e7eaf6}
body.contrib2{--accent:#2f6d3a;--accent-soft:#e4f0e5}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,th.n{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:plaintext}
a{color:var(--accent)}

/* header */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-in{max-width:1400px;margin:auto;display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;cursor:pointer;background:none;border:0;padding:0}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:17px}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.switch{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;margin-inline-start:auto;overflow-x:auto;max-width:100%;scrollbar-width:none}
.switch button{white-space:nowrap}
.switch button{border:0;background:none;padding:6px 14px;border-radius:7px;cursor:pointer;font-weight:700;color:var(--ink-2)}
.switch button.on{background:var(--accent);color:#fff}
.tabs{max-width:1400px;margin:auto;display:flex;gap:2px;padding:0 12px;overflow-x:auto;scrollbar-width:thin}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--ink-2);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}

main{max-width:1400px;margin:auto;padding:18px 16px 60px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;margin:0}
.sub{color:var(--muted);font-size:13px;margin:0}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar .grow{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-b{padding:14px 16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.kpi .l{color:var(--ink-2);font-size:13px}
.kpi .v{font-size:24px;font-weight:800;margin-top:2px}
.kpi .v small{font-size:13px;font-weight:500;color:var(--muted);margin-inline-start:4px}
.kpi .h{font-size:12px;color:var(--muted)}
.kpi.good .v{color:var(--good)} .kpi.bad .v{color:var(--bad)} .kpi.acc{border-top:3px solid var(--accent)}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 9px;font-size:13px;border-radius:6px}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}
.inp,select.inp{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
.inp:focus,.cell:focus{outline:2px solid var(--accent);outline-offset:-1px}
.search{min-width:220px}

/* tables */
.tw{overflow:auto;max-width:100%}
table{border-collapse:collapse;width:100%;background:var(--surface)}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
th{background:var(--surface-2);font-size:13px;color:var(--ink-2);font-weight:700;position:sticky;top:0;z-index:1;white-space:nowrap}
td.n,th.n{text-align:center}
tr.grp td{background:var(--accent-soft);font-weight:800;color:var(--accent)}
tr.tot td{background:var(--surface-2);font-weight:800}
tr.grand td{background:var(--accent);color:#fff;font-weight:800}
tr.off td{color:var(--muted)}
tbody tr:hover td{background:#fafaf7}
tr.grp:hover td{background:var(--accent-soft)}
tr.grand:hover td{background:var(--accent)}
.nm{white-space:nowrap;font-weight:600}
.cell{width:46px;border:1px solid transparent;background:transparent;text-align:center;padding:4px 2px;border-radius:5px;direction:ltr}
.cell:hover{border-color:var(--line-2)}
.cell.z{color:#c9c6bd}
.cell.p{background:var(--good-soft);color:var(--good);font-weight:700}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.t-good{color:var(--good);font-weight:700} .t-bad{color:var(--bad);font-weight:700} .t-mut{color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* progress */
.prog{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* chart */
.chart{position:relative;padding:8px 0 0}
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink-2);margin-bottom:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px;background:var(--c)}
.plot{display:flex;align-items:flex-end;gap:10px;height:210px;border-bottom:1px solid var(--line-2);padding:0 4px;direction:ltr}
.col{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100%;position:relative;cursor:default;min-width:22px}
.col b{display:block;width:40%;max-width:18px;border-radius:4px 4px 0 0;min-height:1px}
.col:hover{background:rgba(0,0,0,.035);border-radius:6px 6px 0 0}
.xl{display:flex;gap:10px;padding:4px 4px 0;direction:ltr}
.xl span{flex:1;text-align:center;font-size:11px;color:var(--muted);min-width:22px}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;padding:7px 10px;border-radius:8px;font-size:12.5px;z-index:100;display:none;line-height:1.6;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.tip i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-inline-end:5px}

/* home */
.home{max-width:980px;margin:30px auto}
.home h1{font-size:28px;text-align:center}
.home .sub{text-align:center;margin-bottom:26px;font-size:15px}
.cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s;text-align:right;width:100%}
.acard:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.acard .ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:24px;color:#fff;margin-bottom:12px}
.acard h2{font-size:21px}
.acard p{color:var(--ink-2);margin:4px 0 14px;font-size:14px}
.acard dl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0}
.acard dt{font-size:12px;color:var(--muted)} .acard dd{margin:0;font-weight:800;font-size:18px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(20,20,18,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:40px 12px;overflow:auto}
.modal{background:var(--surface);border-radius:14px;width:min(560px,100%);min-width:0;max-width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal img{max-width:100%;height:auto}
.modal-b{min-width:0;overflow-x:hidden}
.ov{overflow-x:hidden}
/* nothing may make a page wider than the phone: grid cells shrink (their tables scroll inside .tw), chart columns shrink */
.grid>*,.kpis>*,.cards2>*{min-width:0}
.col,.xl span{min-width:0}
@media (max-width:640px){ .plot,.xl{gap:3px;padding:0} .xl span{font-size:9px;letter-spacing:-.4px} }
/* form columns may shrink: a dropdown never makes a dialog wider than the phone screen (Android sizes <select> to its longest option) */
.row2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important}
.fld{min-width:0}
.fld .inp,.fld select.inp{min-width:0;max-width:100%}
select.inp{text-overflow:ellipsis;overflow:hidden}
@media (max-width:380px){ .row2{grid-template-columns:minmax(0,1fr)!important} }
.modal.wide{width:min(900px,100%)}
.modal-h{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-h h2{flex:1}
.modal-b{padding:16px 18px}
.modal-f{display:flex;gap:8px;justify-content:flex-start;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 14px 14px}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:13px;color:var(--ink-2);font-weight:600;margin-bottom:4px}
.fld .inp{width:100%}
.fld.chk{display:flex;align-items:center;gap:8px}
.fld.chk>span{margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:10px;z-index:200;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.note{background:var(--warn-soft);border:1px solid #efd9a6;color:#6d4a00;border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.muted-box{background:var(--surface-2);border:1px dashed var(--line-2);border-radius:10px;padding:10px 14px;font-size:13.5px;color:var(--ink-2)}
.print-title{display:none}
.omr-w{white-space:nowrap;display:inline-block}
.omr{display:inline-block;height:.74em;width:calc(.74em * 1.493);vertical-align:-.04em;margin-inline:.14em}
.credit{text-align:center;color:var(--muted);font-size:13px;padding:18px 16px 28px;border-top:1px solid var(--line);max-width:1400px;margin:0 auto}
.credit b{color:var(--ink-2);font-weight:700}
main+.credit{margin-top:-40px}
/* first column stays visible while scrolling wide tables sideways */
table.sticky1 tbody tr:not(.grp) td:first-child, table.sticky1 thead th:first-child, table.sticky1 tfoot td:first-child{position:sticky;right:0;z-index:2;background:var(--surface);box-shadow:-1px 0 0 var(--line)}
table.sticky1 thead th:first-child{z-index:3;background:var(--surface-2)}
table.sticky1 tfoot tr.grand td:first-child{background:var(--accent)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mcell{display:block}
.mcell span{display:block;font-size:13px;color:var(--ink-2);margin-bottom:3px}
.mcell .inp{width:100%;text-align:center;direction:ltr}
.mcell.paid .inp{background:var(--good-soft);border-color:#b9dcb9;color:var(--good);font-weight:700}
.syncbig{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.syncbig .btn{font-size:17px;padding:12px 20px;width:100%;justify-content:center}
.steps{margin:0;padding-inline-start:20px;color:var(--ink-2);font-size:14px}
.steps li{margin-bottom:6px}
.topsync{margin-inline-start:6px}
@media (max-width:640px){
  body{font-size:14px}
  .row2{grid-template-columns:1fr 1fr}
  .search{min-width:0;width:100%}
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .kpi{padding:10px 11px}
  .kpi .v{font-size:19px}
  .g2{grid-template-columns:1fr}
  .top-in{padding:8px 12px;gap:8px}
  .brand{font-size:16px}
  .brand small{display:none}
  .switch{order:3;width:100%;margin-inline-start:0}
  .switch button{flex:1}
  .topsync{margin-inline-start:auto}
  main{padding:12px 12px 90px}
  h1{font-size:19px}
  .bar{gap:8px}
  .bar>select.inp{flex:1 1 40%}
  th,td{padding:6px 8px}
  .cell{width:40px;padding:6px 2px}
  .ov{padding:0;align-items:stretch}
  .modal,.modal.wide{width:100%;border-radius:0;min-height:100%;display:flex;flex-direction:column}
  .modal-b{flex:1}
  .modal-f{border-radius:0;position:sticky;bottom:0}
  .home{margin:14px auto}
  .home h1{font-size:23px}
  .acard{padding:16px}
}
@media (max-width:380px){ .row2{grid-template-columns:1fr} .mgrid{grid-template-columns:repeat(2,1fr)} }
@media print{
  body{background:#fff;font-size:12px}
  .top,.bar .btn,.noprint,.btn{display:none!important}
  main{padding:0;max-width:none}
  .card{box-shadow:none;border:0}
  .tw{overflow:visible}
  th{position:static}
  .print-title{display:block;text-align:center;margin-bottom:10px}
  .cell{border:0}
}
</style>
</head>

function removeGroup(d, a, gid, incomeTitle, incomeId){
  const ts = Date.now(), L = d[a];

  if (a !== "aza") {

    total = sum(ps, p => p.amount);
    ps.forEach(p => d.deleted[`majlis:payments:${p.id}`] = ts);
    L.payments = L.payments.filter(p => !set.has(p.memberId));
    mids.forEach(id => { if (L.overrides[id]) { delete L.overrides[id]; L.overridesTs[id] = ts; } });
  } else {
    for (const [y, yr] of Object.entries(L.years)) for (const id of mids) if (yr.pay[id]) {
      total += sum(yr.pay[id]); delete yr.pay[id]; delete yr.ts[id]; d.deleted[`aza:row:${y}:${id}`] = ts;
    }
  }
  mids.forEach(id => d.deleted[`${a}:members:${id}`] = ts);
  L.members = L.members.filter(m => m.groupId !== gid);
  L.groups = L.groups.filter(g => g.id !== gid); d.deleted[`${a}:groups:${gid}`] = ts;

    const ids = Object.keys(DB.aza.years[y]?.pay || {});
    const exp = sum(DB.aza.expenses.filter(e => yearOf(e.date) === y), e => e.amount);
    const inc = sum(DB.aza.income.filter(e => yearOf(e.date) === y), e => e.amount);
    return { y, count: ids.filter(id => !member("aza", id)?.exempt).length, paid: sum(ids, id => AZ.paid(y, id)),
             due: sum(ids, id => AZ.due(y, id)), arrears: sum(ids, id => AZ.arrears(y, id)), exp, inc };
  },
  totals(){
    const ys = AZ.years().map(AZ.yearSummary);
    const paid = sum(ys, r => r.paid), exp = sum(DB.aza.expenses, e => e.amount), inc = sum(DB.aza.income, e => e.amount);
    return { ys, paid, exp, inc, arrears: sum(ys, r => r.arrears), balance: paid + inc - exp };
  },
};

/* ============================================================ جمعية المجلس — calculations */
const MJ = {
  required(mid, pid){
    const o = DB[MK].overrides[mid];
    if (o && o[pid] !== undefined && o[pid] !== null && o[pid] !== "") return n(o[pid]);
    const m = member(MK, mid); if (m && m.exempt) return 0;
    const p = DB[MK].plans.find(p => p.id === pid); return p ? n(p.amount) : 0;
  },
  paid(mid, pid){ return sum(DB[MK].payments.filter(p => p.memberId === mid && (!pid || p.planId === pid)), p => p.amount); },
  member(mid){
    const plans = DB[MK].plans.map(p => { const req = MJ.required(mid, p.id), paid = MJ.paid(mid, p.id); return { p, req, paid, rem: Math.max(0, req - paid) }; });
    return { plans, req: sum(plans, x => x.req), paid: sum(plans, x => x.paid), rem: sum(plans, x => x.rem) };
  },
  totals(){
    const ms = DB[MK].members.filter(m => m.active !== false);
    const per = ms.map(m => ({ m, ...MJ.member(m.id) }));
    const paidAll = sum(DB[MK].payments, p => p.amount);
    const assets = assetsTotal(DB[MK]), exp = sum(DB[MK].expenses, e => e.amount), inc = sum(DB[MK].income, e => e.amount) + assets;
    const petty = PETTY.totals();
    return { per, count: ms.length, req: sum(per, x => x.req), paid: paidAll, rem: sum(per, x => x.rem), exp, inc, assets, petty, balance: paidAll + inc - exp - petty.net };
  },
};

/* where the data lives: this device's storage; ask the browser to keep it (not evict it when space runs low) */
async function storageInfo(){
  const box = document.getElementById("storinfo"); if (!box) return;
  const kb = Math.round((localStorage.getItem(LS_KEY) || "").length * 2 / 1024);
  let persisted = null, quota = "";
  try { persisted = await navigator.storage?.persisted?.(); } catch (e) {}
  try { const est = await navigator.storage?.estimate?.(); if (est?.quota) quota = ` من مساحة متاحة تقارب ${Math.round(est.quota / 1048576).toLocaleString("en-US")} ميجابايت`; } catch (e) {}
  if (!document.body.contains(box)) return;
  box.innerHTML = `حجم البيانات: <b>${kb.toLocaleString("en-US")} كيلوبايت</b>${quota}.<br>` +
    (persisted === true ? `<span class="t-good">✓ الحفظ دائم: المتصفح لن يحذف البيانات تلقائياً.</span>`
     : persisted === false ? `<span class="t-bad">الحفظ غير محمي بعد: قد يحذفها المتصفح عند امتلاء الذاكرة.</span> <button class="btn sm" data-act="persist">طلب الحفظ الدائم</button>`
     : `<span class="t-mut">لا يدعم هذا المتصفح فحص الحفظ الدائم.</span>`) +
    `<br><span class="t-mut">مهما كان الحفظ، أرسل نسخة (⬆ إرسال البيانات) بانتظام — هي نسختك الاحتياطية إذا ضاع الجهاز أو مُسحت بيانات المتصفح.</span>`;
}

function kpi(label, value, hint = "", cls = ""){ return `<div class="kpi ${cls}"><div class="l">${label}</div><div class="v">${value}</div>${hint ? `<div class="h">${hint}</div>` : ""}</div>`; }

/* bar chart: series = [{name,color,values}] labels=[...] */
function barChart(labels, series){
  const max = Math.max(1, ...series.flatMap(s => s.values));
  const cols = labels.map((l,i) => {
    const tip = `<b>${esc(l)}</b><br>` + series.map(s => `<i style="background:${s.color}"></i>${esc(s.name)}: ${fmt(s.values[i])}`).join("<br>");
    return `<div class="col" data-tip="${esc(tip)}">${series.map(s => `<b style="height:${(s.values[i]/max*100).toFixed(2)}%;background:${s.color}"></b>`).join("")}</div>`;
  }).join("");
  return `<div class="chart"><div class="legend">${series.map(s => `<span style="--c:${s.color}">${esc(s.name)}</span>`).join("")}</div>
    <div class="plot">${cols}</div><div class="xl">${labels.map(l => `<span>${esc(l)}</span>`).join("")}</div></div>`;
}

function modal(title, bodyHTML, { wide = false, onSave = null, saveLabel = "حفظ", altLabel = "" } = {}){
  closeModal();
  const ov = document.createElement("div");
  ov.className = "ov"; ov.id = "ov";
  ov.innerHTML = `<form class="modal ${wide ? "wide" : ""}" novalidate><div class="modal-h"><h2>${esc(title)}</h2><button type="button" class="btn sm ghost" data-close>✕</button></div>
    <div class="modal-b">${bodyHTML}</div>
    <div class="modal-f">${onSave && altLabel ? `<button class="btn pri" type="submit" value="alt">${altLabel}</button>` : ""}${onSave ? `<button class="btn ${altLabel ? "" : "pri"}" type="submit" value="save">${saveLabel}</button>` : ""}<button type="button" class="btn" data-close>${onSave ? "إلغاء" : "إغلاق"}</button></div></form>`;
  document.body.appendChild(ov);
  const f = ov.querySelector("form");
  ov.addEventListener("click", e => { if (e.target === ov || e.target.closest("[data-close]")) closeModal(); });
  f.addEventListener("submit", e => {
    e.preventDefault();
    if (!onSave) return closeModal();
    if (!f.checkValidity()) { f.reportValidity(); return; }
    const vals = {};
    new FormData(f).forEach((v,k) => vals[k] = v);
    f.querySelectorAll("input[type=checkbox][name]").forEach(c => vals[c.name] = c.checked);
    vals.__alt = e.submitter?.value === "alt";
    const after = onSave(vals, f);
    if (after !== false) { closeModal(); save(); render(); if (typeof after === "function") after(); }
  });
  const first = f.querySelector("input:not([type=hidden]),select,textarea");
  if (first) first.focus();
  return f;
}
function closeModal(){ document.getElementById("ov")?.remove(); }
function fld(label, name, value = "", type = "text", extra = ""){
  return `<label class="fld"><span>${label}</span><input class="inp" name="${name}" type="${type}" value="${esc(value)}" ${type === "number" ? `step="0.001"` : ""} ${extra}></label>`;
}

function azaStmtData(mid, flt){
  const m = member("aza", mid), fee = AZ.fee();
  let rows = AZ.memberSummary(mid).rows;
  if (flt === "late") rows = rows.filter(r => r.arrears > 0);
  else if (flt) rows = rows.filter(r => r.y === +flt);
  rows = rows.map(r => {
    const dm = m?.exempt ? 0 : AZ.dueMonths(r.y);
    const cells = AZ.row(r.y, mid).map((v, i) => n(v) >= fee || (n(v) > 0 && !fee) ? "paid" : n(v) > 0 ? "part" : i < dm ? "late" : "none");
    return { ...r, cells, lateMonths: cells.map((c, i) => c === "late" || c === "part" ? i : -1).filter(i => i >= 0) };
  });
  return { m, rows, paid: sum(rows, r => r.paid), due: sum(rows, r => r.due), arrears: sum(rows, r => r.arrears) };
}
function azaStmtScope(flt){
  const c = AZ.cutoff();
  return flt === "late" ? "السنوات التي عليها متأخرات" : flt ? `سنة ${flt}${+flt === c.y ? ` (حتى ${MONTHS[c.m - 1]})` : ""}` : `جميع السنوات (حتى ${MONTHS[c.m - 1]} ${c.y})`;

function azaStmtText(d, scope){
  const a = "aza", late = d.rows.filter(r => r.arrears > 0);
  return `${DB[a].settings.title}\n*كشف حساب عضو*\nالاسم: ${d.m.name}\nالمجموعة: ${shortGroup(groupName(a, d.m.groupId))}\nالفترة: ${scope}\nالتاريخ: ${today()}\n\n` +
    `إجمالي المدفوع: ${fmtCur(a, d.paid)}\nإجمالي المستحق: ${fmtCur(a, d.due)}\n*المتأخرات: ${d.arrears ? fmtCur(a, d.arrears) : "لا يوجد ✓"}*\n` +
    (late.length ? `\n*تفاصيل المتأخرات:*\n` + late.map(r => `• ${r.y}: ${fmtCur(a, r.arrears)} (${monthsText(r.lateMonths)})`).join("\n") + "\n" : "") +
    `\nأمين الصندوق: ${treasurer(a)}`;
}
async function drawAzaStmt(d, scope){
  try { await document.fonts?.load?.("700 30px Tajawal"); await document.fonts?.ready; } catch (e) {}
  const a = "aza", W = 900, FF = 'Tajawal, "Segoe UI", Tahoma, Arial, sans-serif', font = (w, s) => `${w} ${s}px ${FF}`;
  const c = document.createElement("canvas"), g = c.getContext("2d");
  const [accent, soft] = accentOf(a), bad = "#c23535", good = "#0c7a0c", amber = "#d08a12", grey = "#e4e2dc";
  const ROW = 58, legendH = 60;
  const H = 200 + 260 + 3 * 96 + 40 + 70 + Math.max(1, d.rows.length) * ROW + 80 + legendH + 170;
  c.width = W; c.height = H;
  g.fillStyle = "#fff"; g.fillRect(0, 0, W, H);
  g.fillStyle = accent; g.fillRect(0, 0, W, 200);
  g.direction = "rtl";
  g.fillStyle = "#fff"; g.textAlign = "right";
  g.font = font(800, 50); fillT(g, DB[a].settings.title, W - 50, 95);
  g.font = font(500, 30); fillT(g, "كشف حساب عضو", W - 50, 150);
  g.textAlign = "left"; g.font = font(500, 26); fillT(g, `التاريخ: ${today()}`, 50, 150);
  // three stat boxes
  const bw = (W - 100 - 2 * 20) / 3, stats = [["إجمالي المدفوع", fmtCur(a, d.paid), accent], ["إجمالي المستحق", fmtCur(a, d.due), "#1b1b19"], ["المتأخرات", d.arrears ? fmtCur(a, d.arrears) : "لا يوجد ✓", d.arrears ? bad : good]];
  stats.forEach(([l, v, col], i) => {
    const x = W - 50 - (i + 1) * bw - i * 20;
    roundRect(g, x, 240, bw, 190, 22); g.fillStyle = soft; g.fill();
    g.textAlign = "center"; g.fillStyle = "#55534e"; g.font = font(500, 26); fillT(g, l, x + bw / 2, 300);
    let size = 48; g.font = font(800, size); while (g.measureText(v).width > bw - 30 && size > 26) g.font = font(800, --size);
    g.fillStyle = col; fillT(g, v, x + bw / 2, 380);
  });
  let y = 520; g.textAlign = "right";
  for (const [l, v] of [["الاسم", d.m.name], ["المجموعة", shortGroup(groupName(a, d.m.groupId))], ["الفترة", scope]]) {
    g.fillStyle = "#8a877f"; g.font = font(500, 24); fillT(g, l, W - 60, y);
    let size = 30; g.font = font(700, size); while (g.measureText(v).width > W - 120 && size > 20) g.font = font(700, --size);
    g.fillStyle = "#1b1b19"; fillT(g, v, W - 60, y + 40);
    g.strokeStyle = "#e4e2dc"; g.lineWidth = 2; g.beginPath(); g.moveTo(60, y + 62); g.lineTo(W - 60, y + 62); g.stroke();
    y += 96;
  }
  // table: year | 12 month cells (month 1 on the right) | paid | arrears
  const YX = W - 75, SQ = 28, GAP = 6, CX0 = W - 170, PX = 265, AX = 115;
  const cellX = i => CX0 - i * (SQ + GAP) - SQ;
  y += 40;
  roundRect(g, 50, y - 40, W - 100, 58, 12); g.fillStyle = soft; g.fill();
  g.fillStyle = accent; g.font = font(700, 24);
  g.textAlign = "right"; fillT(g, "السنة", YX, y);
  g.textAlign = "center"; g.font = font(700, 19);
  for (let i = 0; i < 12; i++) fillT(g, String(i + 1), cellX(i) + SQ / 2, y - 2);
  g.font = font(700, 24); fillT(g, "المدفوع", PX, y); fillT(g, "المتأخر", AX, y);
  y += 62;
  if (!d.rows.length) { g.fillStyle = "#8a877f"; g.font = font(500, 26); g.textAlign = "center"; fillT(g, "لا توجد سنوات في هذه الفترة", W / 2, y); y += ROW; }
  for (const r of d.rows) {
    g.textAlign = "right"; g.fillStyle = "#1b1b19"; g.font = font(800, 27); fillT(g, String(r.y), YX, y);
    r.cells.forEach((st, i) => {
      roundRect(g, cellX(i), y - 24, SQ, SQ, 6);
      g.fillStyle = st === "paid" ? good : st === "part" ? amber : st === "late" ? bad : grey; g.fill();
    });
    g.textAlign = "center"; g.font = font(600, 26); g.fillStyle = "#1b1b19"; fillT(g, fmt(r.paid), PX, y);
    g.fillStyle = r.arrears > 0 ? bad : good; g.font = font(800, 26); fillT(g, r.arrears > 0 ? fmt(r.arrears) : "✓", AX, y);
    g.strokeStyle = "#eeece6"; g.lineWidth = 2; g.beginPath(); g.moveTo(60, y + ROW - 38); g.lineTo(W - 60, y + ROW - 38); g.stroke();
    y += ROW;
  }
  g.font = font(800, 28); g.fillStyle = accent;
  g.textAlign = "right"; fillT(g, "الإجمالي", YX, y + 6);
  g.textAlign = "center"; fillT(g, fmt(d.paid), PX, y + 6);
  g.fillStyle = d.arrears ? bad : good; fillT(g, fmt(d.arrears), AX, y + 6);
  // legend
  y += 80; let lx = W - 75; g.font = font(500, 22); g.textAlign = "right";
  for (const [col, l] of [[good, "مدفوع"], [amber, "مدفوع جزئياً"], [bad, "غير مسدد"], [grey, "غير مستحق بعد"]]) {
    roundRect(g, lx - 22, y - 19, 22, 22, 5); g.fillStyle = col; g.fill();
    g.fillStyle = "#55534e"; fillT(g, l, lx - 32, y); lx -= 32 + g.measureText(l).width + 40;
  }
  g.fillStyle = accent; g.fillRect(0, H - 12, W, 12);
  g.textAlign = "center"; g.fillStyle = "#1b1b19"; g.font = font(700, 28);
  fillT(g, d.arrears ? "نرجو المبادرة بسداد المتأخرات — وجزاكم الله خيراً" : "شكراً لالتزامكم — وجزاكم الله خيراً", W / 2, H - 95);
  g.fillStyle = "#55534e"; g.font = font(500, 24); fillT(g, `أمين الصندوق: ${treasurer(a)} — ${DB[a].settings.title}`, W / 2, H - 50);
  return c;
}

    </div>
    <p class="sub">على الجوال: «مشاركة الصورة» يفتح قائمة المشاركة فتختار واتساب ثم الشخص.</p>`);
  let canvas = null, text = "";
  const draw = async () => {
    const flt = f.querySelector("[name=flt]").value, d = azaStmtData(mid, flt), scope = azaStmtScope(flt);

    if (b.dataset.r === "wa") { window.open(waLink(ph, text), "_blank"); return; }
    const blob = await new Promise(res => canvas.toBlob(res, "image/png"));
    const fname = `كشف حساب ${m.name} ${today()}.png`;
    if (b.dataset.r === "dl") return download(fname, blob, "image/png");

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; } catch (err) { if (err.name === "AbortError") return; }
    }
    download(fname, blob, "image/png"); window.open(waLink(ph, text), "_blank");
    toast("نُزّلت صورة الكشف — أرفقها في محادثة واتساب");
  });
}

/* plans paid in instalments suggest one instalment (never more than what's left) */
function suggestAmount(x){
  if (!x) return 0;
  const inst = n(x.p.installment);
  return inst ? (x.rem > 0 ? Math.min(inst, x.rem) : inst) : x.rem;
}

/* ============================================================ phone-friendly monthly entry (العزاء) */
/* what settling year y costs (= its arrears, same rule as everywhere: due − paid) and which months that covers.
   Payments count in month order, so a lump sum in one cell covers the months after it. */
function azaUnpaid(y, mid){
  const fee = AZ.fee(), amount = AZ.arrears(y, mid);
  if (!amount || !fee) return { idx: [], amount: 0, add: [] };
  const due = AZ.dueMonths(y), paid = AZ.paid(y, mid);
  const start = Math.min(due - 1, Math.floor(paid / fee)), idx = [], add = [];
  let left = amount;
  for (let i = start; i < due && left > 0; i++) {
    const a = Math.min(left, i === start ? (start + 1) * fee - paid : fee);
    if (a <= 0) continue;
    idx.push(i); add.push(a); left -= a;
  }
  if (left > 0 && idx.length) add[add.length - 1] += left;  // safety: never charge less than the arrears
  return { idx, amount, add };
}
function azaMonths(y, mid){
  const m = member("aza", mid), r = DB.aza.years[y].pay[mid], fee = AZ.fee();
  const before = r.slice();
  const myYears = AZ.years().filter(yy => AZ.row(yy, mid));
  const others = myYears.filter(yy => yy !== y).map(yy => ({ y: yy, ...azaUnpaid(yy, mid) })).filter(o => o.idx.length).reverse();
  const f = modal(`${m.name} — اشتراكات ${y}`, `
    <div class="row2">
      <label class="fld"><span>السنة</span><select class="inp" name="yr">${myYears.slice().reverse().map(yy => `<option value="${yy}" ${yy === y ? "selected" : ""}>${yy}${AZ.arrears(yy, mid) ? ` — متأخر ${fmt(AZ.arrears(yy, mid))}` : ""}</option>`).join("")}</select></label>
      <div class="fld"><span>&nbsp;</span><p class="sub" style="margin:6px 0 0">${esc(shortGroup(groupName("aza", m.groupId)))} · الاشتراك الشهري ${fmt(fee)} · متأخر ${y}: ${fmt(AZ.arrears(y, mid))}</p></div>
    </div>
    <div class="mgrid">${MONTHS.map((mn, i) => `<label class="mcell ${n(r[i]) ? "paid" : ""}"><span>${mn}</span><input class="inp" name="m${i}" type="number" step="0.001" min="0" inputmode="decimal" value="${n(r[i]) ? n(r[i]) : ""}" placeholder="0"></label>`).join("")}</div>
    <div class="bar" style="margin-top:12px"><button type="button" class="btn" data-fill="due">✓ تسديد الأشهر المستحقة</button><button type="button" class="btn" data-fill="all">✓ السنة كاملة</button></div>
    ${others.length ? `<div class="muted-box" style="margin-top:12px">
      <div class="bar" style="margin:0 0 6px"><b>متأخرات السنوات الأخرى (${others.length})</b><span class="grow"></span><button type="button" class="btn sm" data-allprev>✓ تحديد الكل</button></div>
      ${others.map(o => `<label class="fld chk" style="margin:4px 0"><input type="checkbox" name="py_${o.y}"><span><b>${o.y}</b> — ${monthsText(o.idx)} — <b>${fmt(o.amount)}</b></span></label>`).join("")}
    </div>` : ""}
    <div class="muted-box" id="pay-total" style="margin-top:10px"></div>`,
  { altLabel: "حفظ وإصدار إيصال", onSave: v => {
      for (let i = 0; i < 12; i++) r[i] = n(v["m" + i]);
      DB.aza.years[y].ts[mid] = now();
      const parts = [];
      const newly = []; let amount = 0;
      for (let i = 0; i < 12; i++) if (r[i] > n(before[i])) { newly.push(i); amount += r[i] - n(before[i]); }
      if (newly.length) parts.push({ y, idx: newly, amount });
      for (const o of others) if (v["py_" + o.y]) {
        const rr = DB.aza.years[o.y].pay[mid];
        o.idx.forEach((i, k) => { rr[i] = n(rr[i]) + o.add[k]; });
        DB.aza.years[o.y].ts[mid] = now();
        parts.push(o);
      }
      parts.sort((a, b) => a.y - b.y);
      const total = sum(parts, p => p.amount);
      toast(total ? `تم الحفظ — ${fmt(total)}${parts.length > 1 ? ` عن ${parts.length} سنوات` : ""}` : "تم الحفظ");
      if (v.__alt) return () => parts.length > 1 ? azaMultiReceipt(mid, parts) : parts.length ? azaReceipt(y, mid, newly, amount) : azaYearReceipt(y, mid);
  }});
  const total = () => {
    let t = 0;
    f.querySelectorAll(".mcell input").forEach((inp, i) => { t += Math.max(0, n(inp.value) - n(before[i])); });
    for (const o of others) if (f.querySelector(`[name=py_${o.y}]`).checked) t += o.amount;
    f.querySelector("#pay-total").innerHTML = `إجمالي هذه الدفعة: <b class="num">${fmtCur("aza", t)}</b>`;
  };

/* ============================================================ group status report (image + WhatsApp, like receipts) */
function groupReportData(a, gid, flt){
  const ms = DB[a].members.filter(m => m.groupId === gid && m.active !== false && !m.exempt);
  let lines;
  if (a === "aza") {
    const ys = flt ? [+flt] : AZ.years();
    lines = ms.map(m => {
      const rows = ys.filter(y => AZ.row(y, m.id)).map(y => ({ y, paid: AZ.paid(y, m.id), due: AZ.due(y, m.id), arr: AZ.arrears(y, m.id) }));
      return { id: m.id, name: m.name, req: sum(rows, r => r.due), paid: sum(rows, r => r.paid), rem: sum(rows, r => r.arr),
        detail: rows.filter(r => r.arr > 0).map(r => flt ? `${fmt(r.arr / AZ.fee())} أشهر غير مسددة` : `${r.y}: ${fmt(r.arr)}`).join("، "), on: rows.length > 0 };
    }).filter(l => l.on);
  } else {
    lines = ms.map(m => {
      const ps = MJ.member(m.id).plans.filter(x => !flt || x.p.id === flt);
      return { id: m.id, name: m.name, req: sum(ps, x => x.req), paid: sum(ps, x => x.paid), rem: sum(ps, x => x.rem),
        detail: ps.filter(x => x.rem > 0).map(x => flt ? `باقي ${fmt(x.rem)} من ${fmt(x.req)}` : `${x.p.name}: ${fmt(x.rem)}`).join("، ") };
    });
  }
  lines.sort((x, y) => (y.rem > 0) - (x.rem > 0) || y.rem - x.rem);
  const req = sum(lines, l => l.req), paid = sum(lines, l => l.paid), rem = sum(lines, l => l.rem);
  return { lines, req, paid, rem, late: lines.filter(l => l.rem > 0).length, pct: req ? Math.min(100, (req - rem) / req * 100) : 100 };
}
function groupReportScope(a, flt){

async function drawReport(a, gname, scope, d){
  try { await document.fonts?.load?.("700 30px Tajawal"); await document.fonts?.ready; } catch (e) {}
  const W = 900, FF = 'Tajawal, "Segoe UI", Tahoma, Arial, sans-serif', font = (w, s) => `${w} ${s}px ${FF}`;
  const c = document.createElement("canvas"), g = c.getContext("2d");
  const wrap = (txt, maxW, f) => {
    g.font = f; const out = []; let line = "";
    for (const w of String(txt ?? "").split(" ")) { const t = line ? line + " " + w : w; if (g.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; }
    if (line) out.push(line); return out;
  };
  const NAME_W = W - 75 - 360, detFont = font(500, 21);
  const laid = d.lines.map(l => ({ ...l, det: l.rem > 0 && l.detail ? wrap(l.detail, NAME_W, detFont) : [] }));

  g.font = font(800, 50); fillT(g, DB[a].settings.title, W - 50, 95);
  g.font = font(500, 30); fillT(g, "تقرير حالة المجموعة", W - 50, 150);
  g.textAlign = "left"; g.font = font(500, 26); fillT(g, `التاريخ: ${today()}`, 50, 150);
  // three stat boxes
  const bw = (W - 100 - 2 * 20) / 3, stats = [["المدفوع", fmtCur(a, d.paid), accent], ["المتبقي", fmtCur(a, d.rem), d.rem ? bad : good], ["نسبة السداد", `${d.pct.toFixed(0)}%`, accent]];
  stats.forEach(([l, v, col], i) => {
    const x = W - 50 - (i + 1) * bw - i * 20;
    roundRect(g, x, 240, bw, 200, 22); g.fillStyle = soft; g.fill();
    g.textAlign = "center"; g.fillStyle = "#55534e"; g.font = font(500, 26); fillT(g, l, x + bw / 2, 300);
    let size = 52; g.font = font(800, size); while (g.measureText(v).width > bw - 30 && size > 28) g.font = font(800, --size);
    g.fillStyle = col; fillT(g, v, x + bw / 2, 385);
  });
  // progress bar
  roundRect(g, 50, 462, W - 100, 14, 7); g.fillStyle = "#eeece6"; g.fill();
  if (d.pct > 0) { const pw = (W - 100) * d.pct / 100; roundRect(g, W - 50 - pw, 462, pw, 14, 7); g.fillStyle = accent; g.fill(); }
  let y = 560; g.textAlign = "right";
  for (const [l, v] of [["المجموعة", gname], ["الفترة / البند", scope], ["الأعضاء", `${d.lines.length} عضو — المتأخرون: ${d.late}`]]) {
    g.fillStyle = "#8a877f"; g.font = font(500, 24); fillT(g, l, W - 60, y);
    g.fillStyle = "#1b1b19"; g.font = font(700, 30); fillT(g, v, W - 60, y + 40);
    g.strokeStyle = "#e4e2dc"; g.lineWidth = 2; g.beginPath(); g.moveTo(60, y + 62); g.lineTo(W - 60, y + 62); g.stroke();
    y += 96;
  }
  // table
  y += 30;
  roundRect(g, 50, y - 40, W - 100, 58, 12); g.fillStyle = soft; g.fill();
  g.fillStyle = accent; g.font = font(700, 25);
  g.textAlign = "right"; fillT(g, "العضو", W - 75, y);
  g.textAlign = "center"; fillT(g, "المدفوع", 285, y); fillT(g, "المتبقي", 125, y);
  y += 62;
  for (const l of laid) {
    let size = 27; g.font = font(700, size); while (g.measureText(l.name).width > NAME_W && size > 19) g.font = font(700, --size);
    g.textAlign = "right"; g.fillStyle = "#1b1b19"; fillT(g, l.name, W - 75, y);
    g.font = font(600, 26); g.textAlign = "center";

    y += h;
  }
  g.font = font(800, 28); g.fillStyle = accent;
  g.textAlign = "right"; fillT(g, "الإجمالي", W - 75, y + 6);
  g.textAlign = "center"; fillT(g, fmt(d.paid), 285, y + 6);
  g.fillStyle = d.rem ? bad : good; fillT(g, fmt(d.rem), 125, y + 6);
  g.fillStyle = accent; g.fillRect(0, H - 12, W, 12);

  aza: ["groups", "members", "expenses", "income", "receipts", "debts", "debtPays"],
  majlis: ["groups", "members", "plans", "payments", "expenses", "income", "stages", "contractorPayments", "receipts", "petty", "pettyBuys"],

};
/* merges R into L in place: newest change per record wins; deletions travel as tombstones */
function mergeDB(L, R){
  const st = { add: 0, upd: 0, del: 0 };
  const tombs = { ...L.deleted };
  for (const [k, t] of Object.entries(R.deleted)) if (!(tombs[k] >= t)) tombs[k] = t;
  const dead = (key, u) => { const t = tombs[key]; return t !== undefined && t >= (u || 0); };
  // associations of المجلس's type created on the other device arrive whole
  L.contribIds = L.contribIds || [];
  for (const key of R.contribIds || []) if (R[key] && !L[key] && !dead(`assoc:${key}`, 0)) { L[key] = R[key]; L.contribIds.push(key); st.add++; }
  for (const key of [...L.contribIds]) if (dead(`assoc:${key}`, 0)) { delete L[key]; L.contribIds = L.contribIds.filter(k => k !== key); st.del++; }
  for (const a of ["aza", "majlis", ...L.contribIds.filter(k => R[k])]) {
    const l = L[a], r = R[a];
    if (r.assetTypesTs > (l.assetTypesTs || 0)) { l.assetTypes = r.assetTypes; l.assetTypesTs = r.assetTypesTs; }
    if ((r.settingsTs || 0) > (l.settingsTs || 0)) { l.settings = r.settings; l.settingsTs = r.settingsTs; st.upd++; }
    for (const name of SYNC_LISTS[a] || SYNC_LISTS.contrib) {
      const arr = l[name] = l[name] || [];
      const idx = new Map(arr.map((x, i) => [x.id, i]));
      for (const item of r[name] || []) {
        if (dead(`${a}:${name}:${item.id}`, item.u)) continue;
        if (!idx.has(item.id)) { idx.set(item.id, arr.length); arr.push(item); st.add++; }
        else if ((item.u || 0) > (arr[idx.get(item.id)].u || 0)) { arr[idx.get(item.id)] = item; st.upd++; }
      }
      const kept = arr.filter(x => !dead(`${a}:${name}:${x.id}`, x.u));
      st.del += arr.length - kept.length; l[name] = kept;
    }
    if ((r.groupsOrderTs || 0) > (l.groupsOrderTs || 0)) {
      const pos = new Map(r.groups.map((g, i) => [g.id, i]));
      l.groups.sort((x, y) => (pos.get(x.id) ?? 1e9) - (pos.get(y.id) ?? 1e9));
      l.groupsOrderTs = r.groupsOrderTs;
    }
  }
  for (const [y, ry] of Object.entries(R.aza.years)) {
    const ly = L.aza.years[y] = L.aza.years[y] || { pay: {}, ts: {} };
    for (const [mid, row] of Object.entries(ry.pay)) {
      const rt = ry.ts[mid] || 0;
      if (dead(`aza:row:${y}:${mid}`, rt)) continue;
      if (!ly.pay[mid]) { ly.pay[mid] = row; if (rt) ly.ts[mid] = rt; st.add++; }
      else if (rt > (ly.ts[mid] || 0)) { ly.pay[mid] = row; ly.ts[mid] = rt; st.upd++; }
    }
  }
  for (const [y, ly] of Object.entries(L.aza.years))
    for (const mid of Object.keys(ly.pay)) if (dead(`aza:row:${y}:${mid}`, ly.ts[mid])) { delete ly.pay[mid]; delete ly.ts[mid]; st.del++; }
  for (const k of ["majlis", ...L.contribIds.filter(c => R[c])]) {
  const lo = L[k], ro = R[k];
  for (const mid of new Set([...Object.keys(ro.overrides || {}), ...Object.keys(ro.overridesTs || {})])) {
    const rt = ro.overridesTs[mid] || 0, lt = lo.overridesTs[mid] || 0;
    if (rt > lt || (rt === lt && !lo.overrides[mid] && ro.overrides[mid])) {
      if (JSON.stringify(lo.overrides[mid]) !== JSON.stringify(ro.overrides[mid])) st.upd++;
      if (ro.overrides[mid]) lo.overrides[mid] = ro.overrides[mid]; else delete lo.overrides[mid];
      if (rt) lo.overridesTs[mid] = rt;
    }
  }
  }
  mergeRoscas(L, R, tombs, st);
  L.deleted = tombs;
  return st;
}
async function exportSync(){
  const at = new Date();
  const name = `مزامنة الجمعيات - ${DEV.name} - ${stamp()} ${String(at.getHours()).padStart(2, "0")}${String(at.getMinutes()).padStart(2, "0")}.json`;
  const data = JSON.stringify({ ...DB, meta: {}, syncFrom: DEV.name, syncAt: at.toISOString() });
  DEV.lastExport = at.toISOString(); saveDev(); DB.meta.lastBackup = at.toISOString(); save();
  if (IS_MOBILE) for (const type of ["application/json", "text/plain"]) {
    const file = new File([data], name, { type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: "مزامنة الجمعيات الأهلية" }); render(); toast("تم الإرسال"); return; }
      catch (e) { if (e.name === "AbortError") { render(); return; } }
    }
  }
  download(name, data, "application/json"); render(); toast("تم حفظ ملف المزامنة في التنزيلات");
}

}

}

/* ============================================================ جمعية مغلقة (closed rotating association)
   every subscription pays a fixed monthly instalment for N months; each month the instalments go into the fund
   and the next subscriber in turn receives instalment × N as soon as the fund covers it (same rule as the Excel sheet) */
const RO_TABS = [["dash", "لوحة المعلومات"], ["pay", "الأقساط الشهرية"], ["turns", "الأدوار والاستلام"], ["late", "المتأخرون"], ["members", "المشتركون"], ["receipts", "الإيصالات"], ["settings", "الإعدادات"], ["sync", "المزامنة"]];
function isRosca(a){ return typeof a === "string" && a.startsWith("r_") && !!DB[a]; }
function tabsOf(a){ return TABS[a] || (isRosca(a) ? RO_TABS : isContrib(a) ? CONTRIB_TABS.map(([k, l]) => k === "assets" ? [k, assetsTitle(a)] : [k, l]) : null); }
function assocList(){ return ["aza", "majlis", ...(DB.contribIds || []).filter(k => DB[k]), ...(DB.roscaIds || []).filter(k => DB[k])]; }
function accentOf(a){ return a === "aza" ? ["#1f6f6b", "#e3f0ee"] : a === "majlis" ? ["#8a5a1c", "#f5ecdd"] : isContrib(a) ? ["#2f6d3a", "#e4f0e5"] : ["#3d4f91", "#e7eaf6"]; }

const RO = {
  N(r){ return Math.max(1, Math.round(n(r.settings.months)) || 24); },
  start(r){ const [y, m] = String(r.settings.start || "2026-01").split("-").map(Number); return { y: y || 2026, m: (m || 1) - 1 }; },
  ym(r, i){ const s = RO.start(r), t = s.m + i; return { y: s.y + Math.floor(t / 12), m: ((t % 12) + 12) % 12 }; },
  label(r, i){ const x = RO.ym(r, i); return `${MONTHS[x.m]} ${x.y}`; },
  nowIdx(r){ const s = RO.start(r), d = new Date(); return (d.getFullYear() - s.y) * 12 + d.getMonth() - s.m; },
  shares(r){ return r.members.filter(m => m.active !== false).slice().sort((a, b) => n(a.order) - n(b.order)); },
  pot(r){ return sum(RO.shares(r), s => s.inst); },
  amount(r, s){ return n(s.payout) || n(s.inst) * RO.N(r); },
  row(r, sid){ let x = r.pay[sid]; if (!x) x = r.pay[sid] = []; while (x.length < RO.N(r)) x.push(0); return x; },
  paid(r, sid){ return sum(RO.row(r, sid)); },
  dueMonths(r){ return Math.max(0, Math.min(RO.N(r), RO.nowIdx(r) + 1)); },
  due(r, s){ return RO.dueMonths(r) * n(s.inst); },
  arrears(r, s){ return Math.max(0, RO.due(r, s) - RO.paid(r, s.id)); },
  /* payout month per subscription: paid-out and pinned ones keep their month; the rest follow the turn order */
  schedule(r){
    const N = RO.N(r), shares = RO.shares(r), pot = RO.pot(r), month = {}, fixed = new Map(), rows = [];
    for (const s of shares) {
      const f = s.paidOut ? n(s.paidOut.month) : (s.fixedMonth === 0 || s.fixedMonth ? n(s.fixedMonth) : null);
      if (f !== null) { fixed.set(s.id, f); month[s.id] = f; }
    }
    const queue = shares.filter(s => !fixed.has(s.id));
    // a later turn never receives before a pinned earlier turn
    const floor = new Map(); let maxFixed = -1;
    for (const s of shares) { if (fixed.has(s.id)) maxFixed = Math.max(maxFixed, fixed.get(s.id)); else floor.set(s.id, maxFixed); }
    let bal = 0;
    for (let i = 0; i < N; i++) {
      bal += pot; const out = [];
      for (const s of shares) if (fixed.get(s.id) === i) { bal -= RO.amount(r, s); out.push(s.id); }
      while (queue.length && i >= floor.get(queue[0].id) && bal + 1e-9 >= RO.amount(r, queue[0])) { const s = queue.shift(); bal -= RO.amount(r, s); month[s.id] = i; out.push(s.id); }
      rows.push({ i, inflow: pot, out, bal });
    }
    return { month, rows, unscheduled: queue.map(s => s.id) };
  },
  totals(r){
    const shares = RO.shares(r);
    const collected = sum(r.members, s => RO.paid(r, s.id)), paidOut = sum(r.members.filter(s => s.paidOut), s => n(s.paidOut.amount));
    return { count: shares.length, people: new Set(shares.map(s => norm(s.name).trim())).size, pot: RO.pot(r), collected, paidOut,
      fund: collected - paidOut, arrears: sum(shares, s => RO.arrears(r, s)), done: shares.filter(s => s.paidOut).length };
  },
  monthsText(r, idx){
    const parts = []; let i = 0;
    while (i < idx.length) {
      let j = i; while (j + 1 < idx.length && idx[j + 1] === idx[j] + 1) j++;
      parts.push(j > i ? `${RO.label(r, idx[i])} – ${RO.label(r, idx[j])}` : RO.label(r, idx[i]));
      i = j + 1;
    }
    return parts.join("، ");
  },
};
function newRosca(title, start, months, currency){
  return { settings: { title, start, months, currency: currency || "ر.ع", treasurer: "" }, settingsTs: now(),
           members: [], pay: {}, payTs: {}, receipts: [], groups: [] };
}
function roStatus(r, s, sc, ni){
  if (s.paidOut) return `<span class="pill good">صُرف ${esc(s.paidOut.date || "")}</span>`;
  const m = sc.month[s.id];
  if (m === undefined) return `<span class="pill bad">لا يكفي الرصيد</span>`;
  if (m < ni) return `<span class="pill bad">متأخر الصرف</span>`;
  if (m === ni) return `<span class="pill warn">مستحق هذا الشهر</span>`;
  return `<span class="pill">قادم</span>`;
}

      </tbody></table></div></div>`;
  },

  pay(){
    const a = S.a, r = DB[a], N = RO.N(r), shares = RO.shares(r), ni = RO.nowIdx(r);
    if (!shares.length) return pageHead("الأقساط الشهرية", "") + `<div class="card"><div class="empty">لا يوجد مشتركون بعد.<br><br><button class="btn pri" data-act="rosub">+ اشتراك جديد</button></div></div>`;
    const head = Array.from({ length: N }, (_, i) => { const x = RO.ym(r, i); return `<th class="n" style="${i === ni ? "background:var(--accent-soft)" : ""}">${MONTHS[x.m]}<br><span class="t-mut" style="font-weight:500">${x.y}</span></th>`; }).join("");
    const body = shares.map(s => {
      const row = RO.row(r, s.id);
      return `<tr data-name="${esc(norm(s.name))}" data-sid="${s.id}"><td class="nm"><span class="t-mut">${s.order}.</span> <a href="#" data-act="romonths" data-id="${s.id}" title="تسجيل الأقساط وإصدار إيصال">${esc(s.name)}</a> <span class="t-mut">(${fmt(s.inst)})</span></td>
        ${row.map((v, i) => `<td class="n" style="padding:2px"><input class="cell ${n(v) ? "p" : "z"}" inputmode="decimal" value="${n(v) ? n(v) : "0"}" data-chg="rocell" data-id="${s.id}" data-i="${i}" aria-label="${esc(s.name)} ${RO.label(r, i)}"></td>`).join("")}
        <td class="n"><b id="rrt-${s.id}">${fmt(sum(row))}</b></td><td class="n" id="rra-${s.id}">${arrearsPill(RO.arrears(r, s))}</td>

/* change the association's period (start month / number of months) and preview the effect first */
function roPeriodForm(){
  const a = S.a, r = DB[a], N0 = RO.N(r);
  const f = modal("مدة الجمعية", `
    <div class="row2">
      ${fld("شهر البداية", "start", r.settings.start, "month", "required")}

        <div style="display:flex;gap:6px"><button type="button" class="btn" data-step="-1" aria-label="إنقاص شهر">−</button>
        <input class="inp" name="months" type="number" min="1" max="120" step="1" value="${N0}" required style="text-align:center;flex:1">
        <button type="button" class="btn" data-step="1" aria-label="زيادة شهر">+</button></div></label>
    </div>
    <div id="rp-prev" class="muted-box"></div>`,
  { onSave: v => {
      const N = Math.round(n(v.months)), start = v.start;
      if (N < 1) { toast("المدة يجب أن تكون شهراً على الأقل"); return false; }
      const blockers = roPeriodBlockers(r, N);
      if (blockers.length) { toast("لا يمكن التقصير: " + blockers[0]); return false; }
      if (start !== r.settings.start && sum(r.members, s => RO.paid(r, s.id)) &&
          !confirm("تغيير شهر البداية يغيّر أسماء الأشهر للأقساط المسجلة (القسط الأول يبقى في الشهر الأول). متابعة؟")) return false;
      for (const s of r.members) {
        const row = r.pay[s.id];
        if (row && row.length > N) { row.length = N; r.payTs[s.id] = now(); }
      }
      r.settings.months = N; r.settings.start = start; r.settingsTs = now();
      toast(`المدة الآن ${N} شهراً — من ${RO.label(r, 0)} إلى ${RO.label(r, N - 1)}`);
  }});
  const inp = f.querySelector("[name=months]"), st = f.querySelector("[name=start]");
  const preview = () => {
    const N = Math.max(1, Math.round(n(inp.value))), tmp = { ...r, settings: { ...r.settings, months: N, start: st.value || r.settings.start } };
    const sc = RO.schedule(tmp), end = sc.rows.at(-1)?.bal ?? 0, insts = [...new Set(RO.shares(r).map(s => n(s.inst)))].sort((x, y) => x - y);
    const blockers = roPeriodBlockers(r, N);
    f.querySelector("#rp-prev").innerHTML = `
      <b>من ${RO.label(tmp, 0)} إلى ${RO.label(tmp, N - 1)}</b> — ${N} شهراً ${N !== N0 ? `<span class="pill ${N > N0 ? "good" : "warn"}">${N > N0 ? "+" : ""}${N - N0} شهر</span>` : ""}<br>
      المبلغ المستحق عند الاستلام: ${insts.map(x => `قسط ${fmt(x)} ← <b>${fmt(x * N)}</b>`).join(" · ")}<br>
      إجمالي ما يُجمع: ${fmtCur(a, RO.pot(r) * N)} · رصيد الصندوق في النهاية: <b class="${Math.abs(end) > 0.001 ? "t-bad" : "t-good"}">${fmt(end)}</b>
      ${sc.unscheduled.length ? `<br><span class="t-bad">لا يكفي الرصيد لتسليم ${sc.unscheduled.length} اشتراكاً خلال المدة.</span>` : ""}
      ${blockers.length ? `<br><span class="t-bad">لا يمكن التقصير إلى ${N} شهراً: ${blockers.join("، ")}</span>` : ""}`;
  };
  f.querySelectorAll("[data-step]").forEach(b => b.onclick = () => { inp.value = Math.max(1, Math.round(n(inp.value)) + +b.dataset.step); preview(); });
  inp.addEventListener("input", preview); st.addEventListener("input", preview);
  preview();
}
/* reasons the period cannot shrink to N months: recorded instalments, payouts or pinned months beyond it */
function roPeriodBlockers(r, N){
  const out = [];
  const paidAfter = r.members.filter(s => (r.pay[s.id] || []).slice(N).some(v => n(v)));
  if (paidAfter.length) out.push(`توجد أقساط مسجلة بعد الشهر ${N} (${paidAfter.map(s => s.name).slice(0, 3).join("، ")})`);
  const outM = r.members.filter(s => (s.paidOut && n(s.paidOut.month) >= N) || ((s.fixedMonth === 0 || s.fixedMonth) && n(s.fixedMonth) >= N && !s.paidOut));
  if (outM.length) out.push(`شهر استلام بعد الشهر ${N} (${outM.map(s => s.name).slice(0, 3).join("، ")})`);
  return out;
}

async function drawDoc(a, sp){

  const W = 900, FF = 'Tajawal, "Segoe UI", Tahoma, Arial, sans-serif', font = (w, s) => `${w} ${s}px ${FF}`;
  const nRows = sum(sp.sections || [], s => s.rows.length + 3);
  const c = document.createElement("canvas"); c.width = W; c.height = 1400 + nRows * 90 + (sp.info?.length || 0) * 100;
  const g = c.getContext("2d");
  const [accent, soft] = accentOf(a);
  const fit = (t, maxW, w, s, min = 16) => { g.font = font(w, s); while (g.measureText(t).width > maxW && s > min) g.font = font(w, --s); };
  const line = (y, col = "#eeece6") => { g.strokeStyle = col; g.lineWidth = 2; g.beginPath(); g.moveTo(60, y); g.lineTo(W - 60, y); g.stroke(); };
  g.fillStyle = "#fff"; g.fillRect(0, 0, W, c.height);
  g.fillStyle = accent; g.fillRect(0, 0, W, 200);
  g.direction = "rtl"; g.fillStyle = "#fff"; g.textAlign = "right";
  fit(DB[a].settings.title, W - 360, 800, 50, 30); fillT(g, DB[a].settings.title, W - 50, 95);
  g.font = font(500, 30); fillT(g, sp.sub, W - 50, 150);
  g.textAlign = "left"; g.font = font(500, 26); fillT(g, `التاريخ: ${today()}`, 50, 150);
  let y = 240;
  // stat boxes, three per row
  const st = sp.stats || [], bw = (W - 100 - 2 * 20) / 3;
  for (let k = 0; k < st.length; k += 3) {
    st.slice(k, k + 3).forEach(([l, v, col, small], i) => {
      const x = W - 50 - (i + 1) * bw - i * 20;
      roundRect(g, x, y, bw, 160, 22); g.fillStyle = soft; g.fill();
      g.textAlign = "center"; g.fillStyle = "#55534e"; fit(l, bw - 24, 500, 24); fillT(g, l, x + bw / 2, y + 50);
      g.fillStyle = col || accent; fit(String(v), bw - 30, 800, 44, 22); fillT(g, v, x + bw / 2, y + 112);
      if (small) { g.fillStyle = "#8a877f"; fit(small, bw - 24, 500, 20, 14); fillT(g, small, x + bw / 2, y + 145); }
    });
    y += 180;
  }
  // info lines
  y += 50; g.textAlign = "right";
  for (const [l, v, col] of sp.info || []) {
    g.fillStyle = "#8a877f"; g.font = font(500, 24); fillT(g, l, W - 60, y);
    g.fillStyle = col || "#1b1b19"; fit(String(v), W - 120, 700, 30, 18); fillT(g, v, W - 60, y + 40);
    line(y + 62, "#e4e2dc"); y += 96;
  }
  // tables
  const cell = (cl, x, yy, w, s) => {
    if (!cl) return; const o = typeof cl === "object" ? cl : { t: cl };
    g.fillStyle = o.col || "#1b1b19"; g.textAlign = x.al || "center";
    fit(String(o.t ?? ""), x.w, o.w || (o.bold ? 800 : 600), s || 26, 14); fillT(g, o.t ?? "", x.x, yy);
  };
  for (const sec of sp.sections || []) {
    y += 30;
    if (sec.title) { g.textAlign = "right"; g.fillStyle = accent; g.font = font(800, 32); fillT(g, sec.title, W - 60, y); y += 50; }
    roundRect(g, 50, y - 40, W - 100, 58, 12); g.fillStyle = soft; g.fill();
    sec.cols.forEach(col => { g.fillStyle = accent; g.textAlign = col.al || "center"; fit(col.h, col.w + 10, 700, 23, 15); fillT(g, col.h, col.x, y); });
    y += 62;
    for (const r of sec.rows) {
      const h = 52 + (r.sub ? 30 : 0);
      if (r.bg) { g.fillStyle = r.bg; g.fillRect(55, y - 38, W - 110, h); }
      r.cells.forEach((cl, i) => cell(cl, sec.cols[i], y, sec.cols[i].w));
      if (r.sub) { g.textAlign = "right"; g.fillStyle = r.sub.col || "#8a877f"; fit(r.sub.t, sec.cols[r.subCol ?? 1].w + (r.subWide || 0), 500, 21, 14); fillT(g, r.sub.t, sec.cols[r.subCol ?? 1].x, y + 30); }
      line(y + h - 34); y += h;
    }
    if (sec.total) { sec.total.forEach((cl, i) => cl && cell({ ...(typeof cl === "object" ? cl : { t: cl }), w: 800, col: cl.col || accent }, sec.cols[i], y + 6, 28)); y += 60; }
    if (sec.note) { g.textAlign = "right"; g.fillStyle = "#8a877f"; g.font = font(500, 21); fillT(g, sec.note, W - 60, y + 10); y += 40; }
  }
  // legend + footer
  if (sp.legend) {
    y += 40; let lx = W - 75; g.font = font(500, 22); g.textAlign = "right";
    for (const [col, l] of sp.legend) { roundRect(g, lx - 22, y - 19, 22, 22, 5); g.fillStyle = col; g.fill(); g.fillStyle = "#55534e"; fillT(g, l, lx - 32, y); lx -= 32 + g.measureText(l).width + 40; }
  }
  const H = y + 190, out = document.createElement("canvas"); out.width = W; out.height = H;
  const o = out.getContext("2d"); o.drawImage(c, 0, 0);
  o.direction = "rtl"; o.fillStyle = accent; o.fillRect(0, H - 12, W, 12);
  o.textAlign = "center"; o.fillStyle = "#1b1b19"; o.font = font(700, 28); fillT(o, sp.foot || "شكراً لكم وجزاكم الله خيراً", W / 2, H - 95);
  o.fillStyle = "#55534e"; o.font = font(500, 24); fillT(o, `أمين الصندوق: ${treasurer(a)} — ${DB[a].settings.title}`, W / 2, H - 50);
  return out;
}
/* generic share window: controls (selects) redraw the image; phone is optional */
async function shareWindow(title, controls, build, { phone = "", savePhone = null, who = "المستلم" } = {}){
  const f = modal(title, `${controls}
    <div id="sh-img" class="empty">جارٍ إعداد التقرير…</div>
    <label class="fld" style="margin-top:12px"><span>رقم واتساب ${who}</span><input class="inp" name="phone" type="tel" inputmode="tel" value="${esc(phone)}" placeholder="مثال: 9xxxxxxx" style="direction:ltr;text-align:right"></label>
    <div class="bar">
      <button type="button" class="btn pri" data-r="share">📤 مشاركة الصورة (واتساب)</button>
      <button type="button" class="btn" data-r="wa">💬 إرسال نصي</button>
      <button type="button" class="btn" data-r="dl">⬇ تنزيل الصورة</button>
    </div>
    <p class="sub">على الجوال: «مشاركة الصورة» يفتح قائمة المشاركة فتختار واتساب ثم الشخص أو المجموعة.</p>`);
  let cur = null;
  const draw = async () => {
    const box = f.querySelector("#sh-img"); box.className = "empty"; box.textContent = "جارٍ إعداد التقرير…";
    cur = await build(f);
    box.className = "";
    box.innerHTML = `<img src="${cur.canvas.toDataURL("image/png")}" alt="صورة التقرير" style="width:100%;max-width:440px;margin:auto;border:1px solid var(--line);border-radius:10px;display:block">`;
    if (cur.phone !== undefined) f.querySelector("[name=phone]").value = cur.phone || "";
  };
  await draw();
  f.querySelectorAll("select").forEach(s => s.addEventListener("change", draw));
  f.addEventListener("click", async e => {
    const b = e.target.closest("[data-r]"); if (!b || !cur) return;
    const ph = f.querySelector("[name=phone]").value.trim();
    if (savePhone) savePhone(ph, cur);
    if (b.dataset.r === "wa") { window.open(waLink(ph, cur.text), "_blank"); return; }
    const blob = await new Promise(res => cur.canvas.toBlob(res, "image/png"));
    if (b.dataset.r === "dl") return download(cur.fname, blob, "image/png");
    const file = new File([blob], cur.fname, { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; } catch (err) { if (err.name === "AbortError") return; }
    }
    download(cur.fname, blob, "image/png"); window.open(waLink(ph, cur.text), "_blank");
    toast("نُزّلت صورة التقرير — أرفقها في محادثة واتساب");
  });
}
const RC = { good: "#0c7a0c", bad: "#c23535", warn: "#b87200", mut: "#8a877f", grey: "#e4e2dc", amber: "#d08a12" };
/* short status of a subscription's turn, for images and texts */
function roTurnState(r, s, sc, ni){
  if (s.paidOut) return { t: "استلم ✓", col: RC.good, long: `استلم ${fmt(s.paidOut.amount)} بتاريخ ${s.paidOut.date || ""}` };
  const m = sc.month[s.id];
  if (m === undefined) return { t: "لا يكفي الرصيد", col: RC.bad, long: "لا يكفي رصيد الصندوق خلال المدة" };
  if (m < ni) return { t: "متأخر الصرف", col: RC.bad, long: `كان موعده ${RO.label(r, m)} ولم يُصرف بعد` };
  if (m === ni) return { t: "هذا الشهر", col: RC.warn, long: `مستحق هذا الشهر (${RO.label(r, m)})` };
  const k = m - Math.max(ni, -1);
  return { t: "قادم", col: RC.mut, long: ni < 0 ? `في ${RO.label(r, m)}` : `في ${RO.label(r, m)} — بعد ${k} ${k === 1 ? "شهر" : k === 2 ? "شهرين" : k <= 10 ? "أشهر" : "شهراً"}` };
}
function roGeneralData(a){
  const r = DB[a], t = RO.totals(r), sc = RO.schedule(r), ni = RO.nowIdx(r), N = RO.N(r), shares = RO.shares(r);
  const list = shares.slice().sort((x, y) => (sc.month[x.id] ?? 1e9) - (sc.month[y.id] ?? 1e9) || n(x.order) - n(y.order))
    .map(s => ({ s, m: sc.month[s.id], st: roTurnState(r, s, sc, ni), paid: RO.paid(r, s.id), arr: RO.arrears(r, s) }));
  const next = list.find(x => !x.s.paidOut);
  const nowTxt = ni < 0 ? `لم تبدأ (تبدأ ${RO.label(r, 0)})` : ni >= N ? "انتهت" : `الشهر ${ni + 1} من ${N} — ${RO.label(r, ni)}`;
  return { r, t, sc, ni, N, list, next, nowTxt, dueAll: sum(shares, s => RO.due(r, s)) };
}

/* one person (all subscriptions with the same name) */
function roPeople(r){
  const map = new Map();
  for (const s of RO.shares(r)) { const k = norm(s.name).trim(); if (!map.has(k)) map.set(k, []); map.get(k).push(s); }
  return [...map.values()];
}
function roPersonData(a, sid){
  const r = DB[a], me = member(a, sid), k = norm(me.name).trim();
  const shares = RO.shares(r).filter(s => norm(s.name).trim() === k);
  if (!shares.length) shares.push(me);
  const sc = RO.schedule(r), ni = RO.nowIdx(r), N = RO.N(r), dm = RO.dueMonths(r);
  const turns = shares.map(s => ({ s, m: sc.month[s.id], st: roTurnState(r, s, sc, ni), amt: RO.amount(r, s), paid: RO.paid(r, s.id), arr: RO.arrears(r, s), total: n(s.inst) * N }));
  const months = Array.from({ length: N }, (_, i) => {
    const due = sum(shares, s => n(s.inst)), paid = sum(shares, s => n(RO.row(r, s.id)[i]));
    const st = paid >= due - 1e-9 && paid > 0 ? "paid" : paid > 0 ? "part" : i < dm ? "late" : "none";
    return { i, due, paid, st, out: turns.filter(x => x.m === i) };
  });
  const inst = sum(shares, s => n(s.inst)), total = sum(turns, x => x.total), paid = sum(turns, x => x.paid), arr = sum(turns, x => x.arr);

}

/* sync for closed associations: whole association, subscriptions, receipts and instalment rows */
function mergeRoscas(L, R, tombs, st){
  const dead = (key, u) => { const t = tombs[key]; return t !== undefined && t >= (u || 0); };
  L.roscaIds = L.roscaIds || [];
  for (const key of R.roscaIds || []) {
    if (!R[key] || dead(`assoc:${key}`, 0)) continue;
    const r = R[key];
    if (!L[key]) { L[key] = r; if (!L.roscaIds.includes(key)) L.roscaIds.push(key); st.add++; continue; }
    const l = L[key];
    if ((r.settingsTs || 0) > (l.settingsTs || 0)) { l.settings = r.settings; l.settingsTs = r.settingsTs; st.upd++; }
    for (const name of ["members", "receipts"]) {
      const arr = l[name] = l[name] || [];
      const idx = new Map(arr.map((x, i) => [x.id, i]));
      for (const item of r[name] || []) {
        if (dead(`${key}:${name}:${item.id}`, item.u)) continue;
        if (!idx.has(item.id)) { idx.set(item.id, arr.length); arr.push(item); st.add++; }
        else if ((item.u || 0) > (arr[idx.get(item.id)].u || 0)) { arr[idx.get(item.id)] = item; st.upd++; }
      }
      const kept = arr.filter(x => !dead(`${key}:${name}:${x.id}`, x.u)); st.del += arr.length - kept.length; l[name] = kept;
    }
    l.pay = l.pay || {}; l.payTs = l.payTs || {};
    for (const [sid, row] of Object.entries(r.pay || {})) {
      const rt = (r.payTs || {})[sid] || 0;
      if (dead(`${key}:row:${sid}`, rt)) continue;
      if (!l.pay[sid]) { l.pay[sid] = row; if (rt) l.payTs[sid] = rt; st.add++; }
      else if (rt > (l.payTs[sid] || 0)) { l.pay[sid] = row; l.payTs[sid] = rt; st.upd++; }
    }
    for (const sid of Object.keys(l.pay)) if (dead(`${key}:row:${sid}`, l.payTs[sid])) { delete l.pay[sid]; delete l.payTs[sid]; st.del++; }
  }
  for (const key of [...L.roscaIds]) if (dead(`assoc:${key}`, 0)) { delete L[key]; L.roscaIds = L.roscaIds.filter(k => k !== key); st.del++; }
}

/* ============================================================ المديونية (جمعية العزاء)
   money taken out of the fund for something other than its purpose; it explains the gap between the book balance
   and the actual bank balance, and is repaid in one payment or in monthly instalments (amount ÷ months) */
const DEBT = {
  paid(id){ return sum(DB.aza.debtPays.filter(p => p.debtId === id), p => p.amount); },
  rem(d){ return Math.max(0, n(d.amount) - DEBT.paid(d.id)); },
  inst(d){ return d.mode !== "monthly" ? n(d.amount) : n(d.inst) || (n(d.months) ? n(d.amount) / n(d.months) : n(d.amount)); },
  lastInst(d){ return n(d.amount) - DEBT.inst(d) * (n(d.months) - 1); },
  monthsDue(d){
    if (d.mode !== "monthly") return 1;
    const [y, m] = String(d.start || today().slice(0, 7)).split("-").map(Number), now2 = new Date();
    return Math.max(0, Math.min(n(d.months), (now2.getFullYear() - y) * 12 + now2.getMonth() - (m - 1) + 1));
  },
  due(d){ return Math.min(n(d.amount), d.mode === "monthly" ? DEBT.inst(d) * DEBT.monthsDue(d) : n(d.amount)); },
  late(d){ return Math.max(0, DEBT.due(d) - DEBT.paid(d.id)); },
  startLabel(d){ const [y, m] = String(d.start || "").split("-").map(Number); return y && m ? `${MONTHS[m - 1]} ${y}` : ""; },
  endLabel(d){
    if (d.mode !== "monthly") return "";
    const [y, m] = String(d.start || "").split("-").map(Number), t = (m - 1) + n(d.months) - 1;
    return y ? `${MONTHS[((t % 12) + 12) % 12]} ${y + Math.floor(t / 12)}` : "";
  },
  totals(){
    const ds = DB.aza.debts, amount = sum(ds, d => d.amount), paid = sum(ds, d => DEBT.paid(d.id));
    const book = AZ.totals().balance, bank = n(DB.aza.settings.bankBalance), outstanding = amount - paid;
    return { count: ds.length, amount, paid, outstanding, late: sum(ds, d => DEBT.late(d)), book, bank,
             gap: book - bank, unexplained: book - outstanding - bank };
  },
  name(d){ return member("aza", d.memberId)?.name || d.name || ""; },
};

/* monthly plan: by months → instalment = amount ÷ months; by instalment → months = amount ÷ instalment rounded up (smaller last instalment) */
function debtPlan(amount, by, monthsIn, instIn){
  const amt = n(amount);
  if (by === "inst") {
    const inst = n(instIn); if (!amt || inst <= 0) return { months: 0, inst: 0, last: 0 };
    const months = Math.max(1, Math.ceil(amt / inst - 1e-9));
    return { months, inst: Math.min(inst, amt), last: Math.round((amt - Math.min(inst, amt) * (months - 1)) * 1000) / 1000 };
  }
  const months = Math.round(n(monthsIn)); if (!amt || months < 1) return { months: 0, inst: 0, last: 0 };
  return { months, inst: amt / months, last: amt / months };
}

/* ============================================================ التقرير السنوي / العام (جمعية المجلس)
   year report: items dated before the year (and undated items imported from Excel) form the opening balance */
function mjReportYears(){
  const m = DB[MK], ys = new Set([new Date().getFullYear()]);
  for (const list of [m.payments, m.income, m.expenses, m.petty, m.pettyBuys, m.contractorPayments, m.assets || []]) for (const x of list) { const y = yearOf(x.date); if (y) ys.add(y); }
  return [...ys].sort((a, b) => b - a);
}
function mjReportData(Y){
  const m = DB[MK], inP = x => !Y || yearOf(x.date) === Y, before = x => Y && (!yearOf(x.date) || yearOf(x.date) < Y);
  const flows = sel => {
    const contrib = m.plans.map(p => ({ p, amt: sum(m.payments.filter(x => x.planId === p.id && sel(x)), x => x.amount) }));
    const pettyW = sum(m.petty.filter(x => x.kind !== "return" && sel(x)), x => x.amount), pettyR = sum(m.petty.filter(x => x.kind === "return" && sel(x)), x => x.amount);
    const assets = (m.assetTypes || []).concat([...new Set((m.assets || []).map(x => x.type))].filter(ty => !(m.assetTypes || []).includes(ty)))
      .map(ty => ({ ty, amt: sum((m.assets || []).filter(x => x.type === ty && sel(x)), x => x.amount) }));
    const contribT = sum(contrib, c => c.amt), inc = sum(m.income.filter(sel), x => x.amount) + sum(assets, x => x.amt), exp = sum(m.expenses.filter(sel), x => x.amount);
    return { contrib, contribT, inc, assets, exp, pettyNet: pettyW - pettyR, inT: contribT + inc, outT: exp + pettyW - pettyR };
  };
  const cur2 = flows(inP), open = Y ? flows(before) : null;
  const opening = open ? open.inT - open.outT : 0;
  const undated = !Y ? 0 : [m.payments, m.income, m.expenses, m.petty].reduce((s, l) => s + l.filter(x => !yearOf(x.date)).length, 0);
  const months = Y ? MONTHS.map((_, i) => {
    const inM = x => yearOf(x.date) === Y && +String(x.date).slice(5, 7) === i + 1;
    return { i, in: sum(m.payments.filter(inM), x => x.amount) + sum(m.income.filter(inM), x => x.amount) + sum((m.assets || []).filter(inM), x => x.amount),
             out: sum(m.expenses.filter(inM), x => x.amount) + sum(m.petty.filter(x => inM(x) && x.kind !== "return"), x => x.amount) - sum(m.petty.filter(x => inM(x) && x.kind === "return"), x => x.amount) };
  }) : null;
  const top = m.expenses.filter(inP).slice().sort((a, b) => n(b.amount) - n(a.amount)).slice(0, 10);
  return { Y, cur: cur2, opening, closing: opening + cur2.inT - cur2.outT, undated, months, top };
}

  const el = e.target.closest("[data-act]");
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el.dataset, el, e);
});
document.addEventListener("change", e => {
  const el = e.target.closest("[data-chg]");
  if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el);
});
document.addEventListener("input", e => {
  if (e.target.matches("[data-search]")) { S.q = e.target.value; applySearch(); }
  if (e.target.name === "member" && e.target.closest("[data-form=mjpay]")) payHint(e.target);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
  // Enter in a grid cell moves to the next month
  if (e.key === "Enter" && e.target.classList.contains("cell")) {
    e.preventDefault();
    const cells = [...document.querySelectorAll(".cell")];
    const i = cells.indexOf(e.target);
    e.target.blur(); cells[i + 1]?.focus(); cells[i + 1]?.select();
  }
});
document.addEventListener("focusin", e => { if (e.target.classList?.contains("cell")) e.target.select(); });
document.addEventListener("submit", e => {
  const f = e.target.closest("[data-form]"); if (!f) return;
  e.preventDefault();
  const v = Object.fromEntries(new FormData(f));
  if (f.dataset.form === "settings") {
    const s = DB[S.a].settings;
    Object.entries(v).forEach(([k, val]) => s[k] = ["monthlyFee","bankBalance","contractTotal","months"].includes(k) ? n(val) : k === "currency" ? cleanCurrency(val) : val);
    DB[S.a].settingsTs = now();
    save(); render(); toast("تم حفظ الإعدادات");
  }
  if (f.dataset.form === "mjpay") {
    const m = DB[MK].members.find(x => x.name === v.member.trim());
    if (!m) return toast("اختر العضو من القائمة");
    if (!n(v.amount)) return toast("أدخل المبلغ");
    const p = touch({ id: uid("mp"), memberId: m.id, planId: v.plan, amount: n(v.amount), date: v.date, note: v.note, createdAt: new Date().toISOString() });
    DB[MK].payments.push(p);
    save(); render(); toast(`تم تسجيل ${fmt(v.amount)} لـ ${m.name}`);
    if (e.submitter?.value === "receipt") majlisReceipt(p.id);
  }
});
function payHint(inp){
  const m = DB[MK].members.find(x => x.name === inp.value.trim());
  const box = document.getElementById("mjhint");
  if (!m) { box.textContent = "اختر العضو لعرض المتبقي عليه."; return; }
  const s = MJ.member(m.id);
  box.innerHTML = `<b>${esc(m.name)}</b> — المدفوع ${fmt(s.paid)}، المتبقي <b class="${s.rem ? "t-bad" : "t-good"}">${fmt(s.rem)}</b><br>` +
    s.plans.map(x => `${esc(x.p.name)}: ${fmt(x.paid)} / ${fmt(x.req)}`).join(" · ");
  const sel = inp.form.querySelector("[name=plan]"), firstDue = s.plans.find(x => x.rem > 0);
  if (firstDue) { sel.value = firstDue.p.id; inp.form.querySelector("[name=amount]").value = suggestAmount(firstDue); }
  sel.onchange = () => { inp.form.querySelector("[name=amount]").value = suggestAmount(MJ.member(m.id).plans.find(x => x.p.id === sel.value)) || ""; };
}
function applySearch(){
  const q = norm(S.q).trim();
  document.querySelectorAll("tr[data-name]").forEach(tr => tr.hidden = q && !tr.dataset.name.includes(q));
  document.querySelectorAll("tr.grp").forEach(g => {
    let el = g.nextElementSibling, any = false;
    while (el && !el.classList.contains("grp")) { if (!el.hidden) any = true; el = el.nextElementSibling; }
    g.hidden = q && !any;
  });
}

/* tooltip */
const tip = document.getElementById("tip");
document.addEventListener("mousemove", e => {
  const c = e.target.closest?.("[data-tip]");
  if (!c) { tip.style.display = "none"; return; }
  tip.innerHTML = c.dataset.tip; tip.style.display = "block";
  const w = tip.offsetWidth; let x = e.clientX + 14; if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  tip.style.left = x + "px"; tip.style.top = (e.clientY + 14) + "px";
});

/* ============================================================ export / backup */
function download(name, content, type){
  const blob = new Blob([content], { type });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function stamp(){ return new Date().toISOString().slice(0,10); }
function backup(){
  DB.meta.lastBackup = new Date().toISOString(); save();
  download(`نسخة احتياطية - الجمعيات الأهلية ${stamp()}.json`, JSON.stringify(DB, null, 1), "application/json");
  render(); toast("تم تصدير النسخة الاحتياطية");
}
function restore(){
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    f.text().then(t => {
      let d; try { d = JSON.parse(t); } catch (e) { return toast("الملف غير صالح"); }
      d = migrate(d);
      if (!d) return toast("هذا ليس ملف نسخة احتياطية لهذا التطبيق");
      if (!confirm("سيتم استبدال كل البيانات الحالية بمحتوى النسخة الاحتياطية (للدمج استخدم «المزامنة»). متابعة؟")) return;
      DB = d; save(); render(); toast("تم الاستيراد بنجاح");
    });
  };
  inp.click();
}
function exportXLS(){
  const tables = [...document.querySelectorAll("main table.export")];
  if (!tables.length) return toast("لا يوجد جدول للتصدير في هذه الصفحة");
  const title = document.querySelector("main h1")?.textContent || "تقرير";
  const html = tables.map(t => {
    const c = t.cloneNode(true);
    c.querySelectorAll(".noprint").forEach(x => x.remove());
    c.querySelectorAll(".omr-w").forEach(x => x.replaceWith("ر.ع"));
    c.querySelectorAll("tr[hidden]").forEach(x => x.remove());
    c.querySelectorAll("input").forEach(i => i.replaceWith(document.createTextNode(i.type === "checkbox" ? (i.checked ? "✓" : "") : i.value)));
    return c.outerHTML;
  }).join("<br>");
  const doc = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8">
    <!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet><x:Name>تقرير</x:Name><x:WorksheetOptions><x:DisplayRightToLeft/></x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->
    <style>td,th{border:1px solid #bbb;padding:4px 8px;font-family:Tahoma}th{background:#eee}tr.grp td{background:#e3f0ee;font-weight:bold}tr.grand td,tr.tot td{background:#ddd;font-weight:bold}</style></head>
    <body dir="rtl"><h2>${esc(DB[S.a].settings.title)} — ${esc(title)}</h2>${html}</body></html>`;
  download(`${DB[S.a].settings.title} - ${title} ${stamp()}.xls`, "﻿" + doc, "application/vnd.ms-excel");
}
let toastT;
function toast(msg){
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600);
}

save(); // persist any one-time data fixes applied by migrate()
{
  const [a, tab] = location.hash.slice(1).split("/");
  if (DB[a] && tabsOf(a)) { S.a = a; S.tab = tabsOf(a).some(t => t[0] === tab) ? tab : "dash"; }
}
render();
/* a sync file shared from WhatsApp straight to the installed app arrives here via the service worker */
if (/[?&]shared=1/.test(location.search) && "caches" in window) (async () => {
  history.replaceState(null, "", location.pathname + location.hash);
  const key = new URL("shared-file", location.href.split(/[?#]/)[0]).href;
  try {
    const c = await caches.open("ahliya-share"), res = await c.match(key);
    if (!res) return toast("لم يصل الملف — حاول المشاركة مرة أخرى");
    const name = decodeURIComponent(res.headers.get("x-name") || ""), txt = await res.text();
    await c.delete(key);
    S.a = S.a || "aza"; S.tab = "sync"; render();
    importSyncText(txt, name, txt.length);
  } catch (e) { toast("تعذّر قراءة الملف المُشارَك"); }
})();
/* installed phone app: work offline and ask the browser not to evict our data */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
try { navigator.storage?.persist?.(); } catch (e) {}
